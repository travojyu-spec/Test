  {l:3,id:'gh',n:'Великанский разгул',e:'Giant’s Havoc',t:'В ярости: досягаемость рукопашных атак +5 фт; если вы меньше Большого и хватает места — вы становитесь Большим. Попав дальнобойной атакой метательным оружием на Силе, добавьте урон ярости.'},

  {l:10,id:'mi',n:'Могучий толчок',e:'Mighty Impel',t:(L,C)=>`В ярости бонусным действием поднимите Среднее или меньшее существо в досягаемости и перенесите его в видимое свободное место в 30 фт от себя. Несогласное — спасбросок Сил (Сл ${LGDC(C,'str')}). Если там нет опоры, существо падает (урон от падения, ничком). Отдельного лимита нет.`}]}),

  {l:3,id:'sf',n:'Духовный фокус',e:'Spiritual Focus',t:L=>'Фокусировкой может быть свеча, хрустальный шар, череп, спиритическая доска или колода таро.'+(L>=6?' Сотворив через фокус заклинание барда, добавьте 1к6 к одному броску урона или лечения.':' С 6 уровня заклинание барда через фокус добавляет 1к6 к урону или лечению.')},
  {l:3,id:'tb',n:'Истории из-за грани',e:'Tales from Beyond',t:'Держа духовный фокус, бонусным действием потратьте Вдохновение барда и бросьте его кость по таблице «Истории духов». Историю можно держать до применения или до короткого либо долгого отдыха; действием примените её к видимому существу в 30 фт (можно к себе). Одновременно — только одна история; Сл — ваша Сл заклинаний. 1 — Хитрый зверь: 10 минут к проверкам Инт, Мдр и Хар цели прибавляется кость. 2 — Знаменитый дуэлянт: ваша рукопашная атака заклинанием по цели, 2 кости + мод. Хар урона силовым полем. 3 — Верные друзья: цель и одно существо в 5 фт от неё получают кость + мод. Хар временных хитов. 4 — Беглец: цель реакцией телепортируется на 30 фт. 5 — Мститель: минуту попавший по цели в ближнем бою получает кость урона силовым полем. 6 — Путник: цель получает кость + уровень барда временных хитов; пока они есть — +10 фт скорости и +1 к КД. 7 — Обольститель: спасбросок Мдр или 2 кости психического урона и недееспособность до конца её следующего хода. 8 — Призрак: цель невидима до конца своего следующего хода или пока не атакует либо не сотворит заклинание. 9 — Громила: существа по выбору цели в 30 фт — спасбросок Сил или 3 кости урона звуком и сбиты с ног. 10 — Дракон: конус огня 30 фт от цели, спасбросок Лов, 4 кости огнём (половина при успехе). 11 — Ангел: цель восстанавливает 2 кости + мод. Хар хитов и избавляется от одного состояния. 12 — Ломатель разумов: спасбросок Инт или 3 кости психического урона и ошеломление до конца её следующего хода.'},
  {l:6,id:'ss',n:'Спиритический сеанс',e:'Spirit Session',t:(L,C)=>`Ритуал в 1 час во время короткого или долгого отдыха с согласными существами — всего участников, включая вас, не больше бонуса мастерства (${C?C.pb:'мастерство'}). Выучите одно заклинание прорицания или некромантии из любого списка, круг не выше числа участников и доступный вам. До следующего долгого отдыха оно считается заклинанием барда и подготовлено. Раз за долгий отдых.`}]}),

 shepherd:LG({n:'Круг пастыря',e:'Circle of the Shepherd',src:'Xanathar’s Guide to Everything (2017)',cv:LGCV.druid,f:[
  {l:3,id:'sw',n:'Речь лесов',e:'Speech of the Woods',t:'Вы знаете Сильван; звери понимают вашу речь, а вы понимаете смысл их звуков и движений.',fx:[{t:'prof',k:'lang',v:'Сильван (Sylvan)'}]},
  {l:3,id:'stt',n:'Тотем духа',e:'Spirit Totem',t:L=>`Бонусным действием призовите дух в 60 фт на минуту: аура радиусом 30 фт (бонусным действием дух перемещается на 60 фт). Медведь: выбранные существа в ауре получают ${5+L} временных хитов и преимущество на проверки и спасброски Силы. Ястреб: реакцией дайте преимущество на бросок атаки по цели, находящейся в ауре; вы и союзники в ауре — преимущество на Восприятие. Единорог: преимущество на проверки поиска существ в ауре; лечение с ячейкой восстанавливает выбранным существам в ауре по ${L} хитов. Раз за короткий или долгий отдых.`,fx:[LGU('Тотем духа',1,'кор./дол.')]},
  {l:6,id:'ms',n:'Могучий призыватель',e:'Mighty Summoner',t:'Звери и феи, призванные вашими заклинаниями, получают +2 хита за каждую кость хитов, а их природное оружие считается магическим. С заклинаниями 2024 года бонус к хитам работает не везде: у «Призыва животных» нет отдельных существ, а у духов «Призыва зверя» и «Призыва феи» хиты считаются формулой без костей хитов — тогда действует только магическое оружие.'},
  {l:10,id:'gs',n:'Дух-хранитель',e:'Guardian Spirit',t:L=>`Призванные вами звери и феи, заканчивающие ход в ауре Тотема духа, восстанавливают ${Math.floor(L/2)} хитов.`}]}),
 spores:LG({n:'Круг спор',e:'Circle of Spores',src:'Tasha’s Cauldron of Everything (2020)',cv:LGCV.druid+' Заклинания круга 2 и 3 уровня — сразу на 3 уровне.',f:[
  {l:3,id:'ds',n:'Заклинания круга спор',e:'Circle Spells',t:'Всегда подготовлены: 3 ур. — Леденящее прикосновение, Слепота/глухота, Нетленные останки; 5 — Оживление мертвецов, Газообразная форма; 7 — Усыхание, Смятение; 9 — Смертельное облако, Заражение.',fx:[SP(3,['chilltouch','blindnessdeafness','gentlerepose']),SP(5,['animatedead','gaseousform']),SP(7,['blight','confusion']),SP(9,['cloudkill','contagion'])]},
  {l:3,id:'hs',n:'Ореол спор',e:'Halo of Spores',t:(L,C)=>`Реакцией, когда видимое существо входит в 10 фт от вас или начинает там ход: спасбросок Тел (Сл ${LGSDC(C)}) или ${L>=10?'1к8':L>=6?'1к6':'1к4'} некротического урона.`},
  {l:3,id:'se',n:'Симбиотическая сущность',e:'Symbiotic Entity',t:L=>`Действием потратьте Дикий облик: ${4*L} временных хитов. Пока они есть (до 10 минут): кость Ореола спор бросается дважды, а ваши рукопашные атаки оружием наносят +1к6 некротического урона.`},
  {l:6,id:'fi',n:'Грибковое заражение',e:'Fungal Infestation',t:'Реакцией, когда Маленький или Средний зверь или гуманоид умирает в 10 фт, поднимите его зомби с 1 хитом на час. Он действует сразу после вас, подчиняется мысленным командам и может совершать только действие Атака — одну рукопашную атаку. Использований = мод. Мудрости (мин. 1) за долгий отдых.',fx:[LGU('Грибковое заражение',md('wis'),'дол.')]},
  {l:10,id:'ss',n:'Распространение спор',e:'Spreading Spores',t:'Пока активна Симбиотическая сущность, бонусным действием бросьте споры в куб 10 фт в 30 фт на минуту: существо, входящее в куб или начинающее там ход, получает урон Ореола спор (спасбросок Тел). Пока куб есть, Ореол реакцией не используется.'}]}),
 wildfire:LG({n:'Круг дикого огня',e:'Circle of Wildfire',src:'Tasha’s Cauldron of Everything (2020)',cv:LGCV.druid+' Заклинания круга 2 и 3 уровня — сразу на 3 уровне.',f:[
  {l:3,id:'ds',n:'Заклинания круга дикого огня',e:'Circle Spells',t:'Всегда подготовлены: 3 ур. — Огненные ладони, Лечение ран, Пылающий шар, Палящий луч; 5 — Рост растений, Возрождение; 7 — Аура жизни, Огненный щит; 9 — Небесный огонь, Множественное лечение ран.',fx:[SP(3,['burninghands','curewounds','flamingsphere','scorchingray']),SP(5,['plantgrowth','revivify']),SP(7,['auraoflife','fireshield']),SP(9,['flamestrike','masscurewounds'])]},
  {l:3,id:'sw',n:'Призыв духа дикого огня',e:'Summon Wildfire Spirit',t:(L,C)=>`Действием потратьте Дикий облик: дух появляется в 30 фт на час; существа в 10 фт от него (кроме вас) — спасбросок Лов или 2к6 огнём. Дух: КД 13, хиты ${5+5*L}; Огненное семя — дальняя атака заклинанием 60 фт, 1к6 + ${C?C.pb:'мастерство'} огнём; Огненный телепорт — переносит его, вас и согласных существ рядом на 15 фт (в месте ухода спасбросок Лов или 1к6 + мастерство огнём). Действует после вас, бонусным действием командуйте им.`},
  {l:6,id:'eb',n:'Усиленная связь',e:'Enhanced Bond',t:'Пока дух призван: заклинание, наносящее урон огнём или восстанавливающее хиты, добавляет 1к8 к одному броску; заклинания с дистанцией можно творить из точки духа.'},
  {l:10,id:'cf',n:'Прижигающее пламя',e:'Cauterizing Flames',t:'Когда Маленькое или большее существо умирает в 30 фт от вас или духа, на его месте на минуту остаётся пламя. Реакцией, когда видимое существо входит в это место, погасите пламя: существо восстанавливает или получает (огнём) 2к10 + мод. Мдр хитов. Использований = бонус мастерства за долгий отдых.',fx:[LGU('Прижигающее пламя',LGPB,'дол.')]}]})
});

// --- Воин ---
Object.assign(CLS.fighter.subs,{
 arcanearcher:LG({n:'Мистический лучник',e:'Arcane Archer',src:'Xanathar’s Guide to Everything (2017)',f:[
  {l:3,id:'al',n:'Знания мистического лучника',e:'Arcane Archer Lore',t:'Владение Магией или Природой; заговор «Фокусы» или «Искусство друидов» (Интеллект).',fx:[CH('s','skill',1,{from:['arcana','nature'],label:'Мистический лучник: навык',step:5}),CH('c','opt',1,{label:'Мистический лучник: заговор',pfx:'Заговор',opts:[{v:'pr',n:'Фокусы',e:'Prestidigitation',fx:[{t:'spells',ids:['prestidigitation'],ab:'int',note:'Подкласс'}]},{v:'dc',n:'Искусство друидов',e:'Druidcraft',fx:[{t:'spells',ids:['druidcraft'],ab:'int',note:'Подкласс'}]}]})]},
  {l:3,id:'as',n:'Мистический выстрел',e:'Arcane Shot',t:(L,C)=>`Раз в ход, стреляя из короткого или длинного лука, примените один из известных выстрелов (Сл ${LGDC(C,'int')}). 2 использования (короткий или долгий отдых). Известно выстрелов: ${L>=10?4:L>=7?3:2}.`,fx:[LGU('Мистический выстрел',2,'кор./дол.'),CH('o','opt',L=>L>=10?4:L>=7?3:2,{label:'Мистические выстрелы',ref:'ASHOT',pfx:'Выстрел'})]},
  {l:7,id:'ma',n:'Магическая стрела',e:'Magic Arrow',t:'Стрелы, выпущенные вами из лука, считаются магическими.'},
  {l:7,id:'cs',n:'Изогнутый выстрел',e:'Curving Shot',t:'Промахнувшись магической стрелой, бонусным действием перебросьте атаку по другой цели в 60 фт от первой.'}]}),
 cavalier:LG({n:'Кавалерист',e:'Cavalier',src:'Xanathar’s Guide to Everything (2017)',f:[
  {l:3,id:'bp',n:'Дополнительное владение',e:'Bonus Proficiency',t:'Владение одним навыком: Уход за животными, История, Проницательность, Выступление или Убеждение (по книге можно вместо навыка выучить язык).',fx:[CH('s','skill',1,{from:['animal','history','insight','performance','persuasion'],label:'Кавалерист: навык',step:5})]},
  {l:3,id:'bs',n:'Рождённый в седле',e:'Born to the Saddle',t:'Преимущество на спасброски от падения с ездового животного; падая с него не выше 10 фт, вы приземляетесь на ноги. Сесть или спешиться стоит 5 фт перемещения.'},
  {l:3,id:'um',n:'Неотступная метка',e:'Unwavering Mark',t:L=>`Попав рукопашной атакой, пометьте цель до конца вашего следующего хода: пока вы в 5 фт от неё, она атакует других с помехой. Если она нанесла урон не вам, в свой ход бонусным действием атакуйте её с преимуществом, +${Math.floor(L/2)} урона. Таких атак = мод. Силы (мин. 1) за долгий отдых.`,fx:[LGU('Неотступная метка: атака',md('str'),'дол.')]},
  {l:7,id:'wm',n:'Защитный манёвр',e:'Warding Maneuver',t:'Держа рукопашное оружие или щит, реакцией, когда по вам или видимому существу в 5 фт попадают, добавьте 1к8 к КД цели против этой атаки; если атака всё равно попала, у цели сопротивление её урону. Использований = мод. Телосложения (мин. 1) за долгий отдых.',fx:[LGU('Защитный манёвр',md('con'),'дол.')]},
  {l:10,id:'hl',n:'Держать строй',e:'Hold the Line',t:'Существа провоцируют вашу атаку возможности, перемещаясь на 5 фт и более внутри вашей досягаемости; попав ею, снизьте скорость цели до 0 до конца хода.'}]}),
 echoknight:LG({n:'Рыцарь эха',e:'Echo Knight',src:'Explorer’s Guide to Wildemount (2020)',f:[
  {l:3,id:'me',n:'Явление эха',e:'Manifest Echo',t:(L,C)=>`Бонусным действием создайте эхо в 15 фт: КД ${C?14+C.pb:'14 + мастерство'}, 1 хит, иммунитет ко всем состояниям. В свой ход мысленно перемещайте его до 30 фт (без действия); бонусным действием меняйтесь с ним местами за 15 фт перемещения. Атакуя действием Атака, любую атаку можно совершить из места эха. Если видимое вами существо в 5 фт от эха отходит от него на 5 фт и больше, реакцией совершите по нему атаку возможности как будто из места эха. Эхо разрушается, если в конце вашего хода оно дальше 30 фт от вас.`},
  {l:3,id:'ui',n:'Высвобождение воплощения',e:'Unleash Incarnation',t:'Совершая действие Атака, сделайте ещё одну рукопашную атаку из места эха. Использований = мод. Телосложения (мин. 1) за долгий отдых.',fx:[LGU('Высвобождение воплощения',md('con'),'дол.')]},
  {l:7,id:'ea',n:'Аватар эха',e:'Echo Avatar',t:'Действием видьте и слышите через эхо до 10 минут; эхо может удаляться от вас до 1000 фт.'},
  {l:10,id:'sm',n:'Теневой мученик',e:'Shadow Martyr',t:'Реакцией, когда существо атакует видимое вами существо, телепортируйте эхо в 5 фт от цели — атака переходит на эхо. Раз за короткий или долгий отдых.',fx:[LGU('Теневой мученик',1,'кор./дол.')]}]}),
 runeknight:LG({n:'Рунный рыцарь',e:'Rune Knight',src:'Tasha’s Cauldron of Everything (2020)',f:[
  {l:3,id:'bp',n:'Дополнительное владение',e:'Bonus Proficiencies',t:'Владение инструментами кузнеца; вы знаете Великаний язык.',fx:[{t:'prof',k:'tool',v:TL.smith},{t:'prof',k:'lang',v:'Великаний (Giant)'}]},
  {l:3,id:'rc',n:'Резчик рун',e:'Rune Carver',t:(L,C)=>`Нанесите руны на оружие, доспех, щит или украшение. Пассивный эффект действует всегда; активный — раз за короткий или долгий отдых за каждую руну (Сл ${LGDC(C,'con')}). Известно рун: ${L>=10?4:L>=7?3:2}.`,fx:[CH('r','opt',L=>L>=10?4:L>=7?3:2,{label:'Руны',ref:'RUNES',pfx:'Руна'})]},
  {l:3,id:'gm',n:'Мощь великана',e:'Giant’s Might',t:L=>`Бонусным действием на минуту: вы становитесь Большим (если хватает места), получаете преимущество на проверки и спасброски Силы и раз в ход +${L>=10?'1к8':'1к6'} урона оружием. Использований = бонус мастерства за долгий отдых.`,fx:[LGU('Мощь великана',LGPB,'дол.')]},
  {l:7,id:'rs',n:'Рунический щит',e:'Runic Shield',t:'Реакцией, когда по видимому существу в 60 фт попадают атакой, заставьте атакующего перебросить к20. Использований = бонус мастерства за долгий отдых.',fx:[LGU('Рунический щит',LGPB,'дол.')]},
  {l:10,id:'gs',n:'Великанский рост',e:'Great Stature',t:'Вы вырастаете на 3к4 дюйма; урон Мощи великана — 1к8.'}]}),
 samurai:LG({n:'Самурай',e:'Samurai',src:'Xanathar’s Guide to Everything (2017)',f:[
  {l:3,id:'bp',n:'Дополнительное владение',e:'Bonus Proficiency',t:'Владение одним навыком: История, Проницательность, Выступление или Убеждение (по книге можно вместо навыка выучить язык).',fx:[CH('s','skill',1,{from:['history','insight','performance','persuasion'],label:'Самурай: навык',step:5})]},
  {l:3,id:'fs',n:'Боевой дух',e:'Fighting Spirit',t:L=>`Бонусным действием: преимущество на атаки оружием до конца хода и ${L>=10?10:5} временных хитов. 3 раза за долгий отдых.`,fx:[LGU('Боевой дух',3,'дол.')]},
  {l:7,id:'ec',n:'Изысканный придворный',e:'Elegant Courtier',t:'К проверкам Убеждения прибавляйте мод. Мудрости (учтено, даже если он отрицательный). Владение спасбросками Мудрости; если оно уже есть — Интеллекта или Харизмы.',fx:[{t:'skB',sk:['persuasion'],ab:'wis',raw:1},CH('sv','opt',1,{label:'Изысканный придворный: спасбросок',pfx:'Спасбросок',opts:[{v:'wis',n:'Мудрость',e:'Wisdom',fx:[{t:'prof',k:'save',v:'wis'}]},{v:'int',n:'Интеллект — если Мудрость уже есть',e:'Intelligence',fx:[{t:'prof',k:'save',v:'int'}]},{v:'cha',n:'Харизма — если Мудрость уже есть',e:'Charisma',fx:[{t:'prof',k:'save',v:'cha'}]}]})]},
  {l:10,id:'ts',n:'Неутомимый дух',e:'Tireless Spirit',t:'Если при броске инициативы у вас не осталось использований Боевого духа, одно восстанавливается.'}]})
});

// --- Монах ---
Object.assign(CLS.monk.subs,{
 astralself:LG({n:'Путь астрального «я»',e:'Way of the Astral Self',src:'Tasha’s Cauldron of Everything (2020)',cv:LGCV.monk,f:[
  {l:3,id:'aa',n:'Руки астрального «я»',e:'Arms of the Astral Self',t:'Бонусным действием за 1 очко призовите призрачные руки на 10 минут; при появлении выбранные видимые существа в 10 фт проходят спасбросок Лов или получают урон силовым полем = 2 броска кости боевых искусств. Пока руки есть: для проверок и спасбросков Силы можно использовать Мудрость; безоружные удары руками в свой ход — досягаемость +5 фт; атака и урон ими могут идти через Мудрость, урон силовым полем.'},
  {l:6,id:'va',n:'Облик астрального «я»',e:'Visage of the Astral Self',t:'Бонусным действием за 1 очко (или вместе с руками) призовите маску на 10 минут: вы видите в обычной и магической тьме на 120 фт, получаете преимущество на Проницательность и Запугивание, а голос можно направить только одному существу в 60 фт или сделать слышным на 600 фт.'},
  {l:11,id:'ba',n:'Тело астрального «я»',e:'Body of the Astral Self',t:'Когда призваны и руки, и маска: реакцией уменьшите урон кислотой, холодом, огнём, силовым полем, электричеством или звуком на 1к10 + мод. Мдр; раз в ход при попадании руками — +1 кость боевых искусств урона.'}]}),
 ascendantdragon:LG({n:'Путь восходящего дракона',e:'Way of the Ascendant Dragon',src:'Fizban’s Treasury of Dragons (2021)',cv:LGCV.monk,f:[
  {l:3,id:'dd',n:'Драконий ученик',e:'Draconic Disciple',t:'Урон безоружных ударов может быть кислотой, холодом, огнём, электричеством или ядом. Проваленную проверку Запугивания или Убеждения можно реакцией перебросить (раз за долгий отдых, если переброс удался). Вы выучиваете один язык: Драконий или другой на выбор.',fx:[CH('l','lang',1,{label:'Драконий ученик: Драконий или другой язык',step:5})]},
  {l:3,id:'bd',n:'Дыхание дракона',e:'Breath of the Dragon',t:(L,C)=>`Заменив одну атаку действия Атака, выдохните конус 20 фт или линию 30×5 фт: спасбросок Лов (Сл ${LGDC(C,'wis')}), урон = ${L>=11?3:2} броска кости боевых искусств выбранной стихией (половина при успехе). Использований = бонус мастерства за долгий отдых, затем — за 2 очка.`,fx:[LGU('Дыхание дракона',LGPB,'дол.')]},
  {l:6,id:'wu',n:'Расправленные крылья',e:'Wings Unfurled',t:'Используя Шаг ветра, получите скорость полёта, равную обычной, до конца хода. Использований = бонус мастерства за долгий отдых.',fx:[LGU('Расправленные крылья',LGPB,'дол.')]},
  {l:11,id:'aw',n:'Облик змия',e:'Aspect of the Wyrm',t:'Бонусным действием на минуту — аура 10 фт. Пугающее присутствие: при создании ауры и затем бонусным действием в каждом ходу выберите одно существо в ней — спасбросок Мдр или испугано на минуту (повтор в конце каждого его хода). Сопротивление: вы и выбранные союзники в ауре получаете сопротивление выбранной стихии. Раз за долгий отдых или за 3 очка.',fx:[LGU('Облик змия',1,'дол.')]}]}),
 drunkenmaster:LG({n:'Путь пьяного мастера',e:'Way of the Drunken Master',src:'Xanathar’s Guide to Everything (2017)',cv:LGCV.monk,f:[
  {l:3,id:'bp',n:'Дополнительное владение',e:'Bonus Proficiencies',t:'Владение Выступлением и инструментами пивовара.',fx:[{t:'prof',k:'skill',v:'performance'},{t:'prof',k:'tool',v:TL.brew}]},
  {l:3,id:'dt',n:'Пьяная техника',e:'Drunken Technique',t:'Используя Шквал ударов, получите преимущества Отхода и +10 фт скорости до конца хода.'},
  {l:6,id:'ts',n:'Хмельное покачивание',e:'Tipsy Sway',t:'Вставание из положения ничком стоит 5 фт перемещения. Реакцией, когда по вам промахиваются рукопашной атакой, за 1 очко перенаправьте её в другое существо в 5 фт от вас (кроме атакующего).'},
  {l:11,id:'dl',n:'Удача пьяницы',e:'Drunkard’s Luck',t:'Перед проверкой, атакой или спасброском с помехой потратьте 2 очка, чтобы помеху отменить.'}]}),

 phantom:LG({n:'Фантом',e:'Phantom',src:'Tasha’s Cauldron of Everything (2020)',f:[

  {l:3,id:'wg',n:'Вопли из могилы',e:'Wails from the Grave',t:L=>`Сразу после Скрытой атаки выберите второе существо в 30 фт от первого: ${Math.ceil(Math.ceil(L/2)/2)}к6 некротического урона (половина костей Скрытой атаки). Использований = бонус мастерства за долгий отдых.`,fx:[LGU('Вопли из могилы',LGPB,'дол.')]},
  {l:9,id:'td',n:'Памятки ушедших',e:'Tokens of the Departed',t:'Реакцией, когда существо в 30 фт умирает, создайте памятку души (их не больше бонуса мастерства). Пока она у вас — преимущество на спасброски Телосложения и от смерти. Разбив памятку при Скрытой атаке, примените Вопли без траты использования. Действием задайте духу памятки один вопрос.'},
  {l:13,id:'gw',n:'Призрачная поступь',e:'Ghost Walk',t:'Бонусным действием на 10 минут: полёт 10 фт с парением, атаки по вам с помехой; существа и предметы для вас — труднопроходимая местность, закончив ход внутри них, получите 1к10 урона силовым полем. Раз за долгий отдых или за разбитую памятку.',fx:[LGU('Призрачная поступь',1,'дол.')]}]}),
 scout:LG({n:'Разведчик',e:'Scout',src:'Xanathar’s Guide to Everything (2017)',f:[
  {l:3,id:'sk',n:'Застрельщик',e:'Skirmisher',t:'Реакцией, когда враг заканчивает ход в 5 фт от вас, отойдите на половину скорости без атак возможности.'},
  {l:3,id:'sv',n:'Выживальщик',e:'Survivalist',t:'Владение Природой и Выживанием с компетентностью.',fx:[{t:'prof',k:'skill',v:['nature','survival']},{t:'exp',v:['nature','survival']}]},
  {l:9,id:'sm',n:'Превосходная подвижность',e:'Superior Mobility',t:'Скорость ходьбы +10 фт (и лазания и плавания, если они у вас есть).',fx:[{t:'speed',v:10}]},
  {l:13,id:'am',n:'Мастер засад',e:'Ambush Master',t:'Преимущество на инициативу. В первом раунде первое существо, по которому вы попали, до начала вашего следующего хода атакуется с преимуществом.'}]}),
 swashbuckler:LG({n:'Бретёр',e:'Swashbuckler',src:'Xanathar’s Guide to Everything (2017)',f:[
  {l:3,id:'ff',n:'Изящная работа ног',e:'Fancy Footwork',t:'Совершив рукопашную атаку по существу, до конца хода вы не провоцируете его атаки возможности.'},
  {l:3,id:'ra',n:'Дерзкая наглость',e:'Rakish Audacity',t:'К инициативе прибавляйте мод. Харизмы (уже учтено). Скрытая атака работает без преимущества, если цель — единственное существо в 5 фт от вас и у вас нет помехи.',fx:[{t:'initAb',ab:'cha'}]},
  {l:9,id:'pa',n:'Щегольство',e:'Panache',t:'Действием — проверка Убеждения против Проницательности существа, которое вас слышит: враждебное минуту атакует других с помехой и не делает по ним атак возможности (пока вы в 60 фт); невраждебное — очаровано на минуту.'},
  {l:13,id:'em',n:'Изящный манёвр',e:'Elegant Maneuver',t:'Бонусным действием получите преимущество на следующую проверку Акробатики или Атлетики в этом ходу.'}]})
});

 divinesoul:LG({n:'Божественная душа',e:'Divine Soul',src:'Xanathar’s Guide to Everything (2017)',cv:LGCV.sorc,f:[
  {l:3,id:'dm',n:'Божественная магия',e:'Divine Magic',t:'Заклинания и заговоры жреца доступны вам как заклинания чародея. Родство с божественным даёт одно всегда подготовленное заклинание: добро — «Лечение ран», зло — «Нанесение ран», закон — «Благословение», хаос — «Порча», нейтральность — «Защита от добра и зла».',fx:[{t:'listAdd',v:'c'},{t:'canAdd',v:'c'},CH('af','opt',1,{label:'Божественная душа: родство',pfx:'Родство',opts:[
   {v:'good',n:'Добро',e:'Good',t:'Лечение ран.',fx:[SP(3,['curewounds'])]},
   {v:'evil',n:'Зло',e:'Evil',t:'Нанесение ран.',fx:[SP(3,['inflictwounds'])]},

  {l:3,id:'fg',n:'Благосклонность богов',e:'Favored by the Gods',t:'Провалив спасбросок или промахнувшись атакой, добавьте к броску 2к4. Раз за короткий или долгий отдых.',fx:[LGU('Благосклонность богов',1,'кор./дол.')]},
  {l:6,id:'eh',n:'Усиленное лечение',e:'Empowered Healing',t:'Когда вы или союзник в 5 фт бросаете кости лечения, за 1 единицу чародейства перебросьте любые из них (раз в ход).'}]}),
 shadowmagic:LG({n:'Магия тени',e:'Shadow Magic',src:'Xanathar’s Guide to Everything (2017)',cv:LGCV.sorc,f:[
  {l:3,id:'ed',n:'Глаза тьмы',e:'Eyes of the Dark',t:'Тёмное зрение 120 фт. «Тьма» всегда подготовлена; сотворив её за 2 единицы чародейства, вы видите сквозь неё.',fx:[{t:'sense',k:'Тёмное зрение',v:120},SP(3,['darkness'])]},
  {l:3,id:'sg',n:'Сила могилы',e:'Strength of the Grave',t:'Опустившись до 0 хитов не от излучения и не от критического попадания, пройдите спасбросок Хар (Сл 5 + полученный урон): при успехе останьтесь с 1 хитом. Раз за долгий отдых.',fx:[LGU('Сила могилы',1,'дол.')]},
  {l:6,id:'ho',n:'Гончая дурного знамения',e:'Hound of Ill Omen',t:L=>`Бонусным действием за 3 единицы чародейства призовите гончую (как лютый волк, ${Math.floor(L/2)} временных хитов) к существу в 120 фт на 5 минут. Пока гончая в 5 фт от цели, та проходит спасброски от ваших заклинаний с помехой.`}]}),
 stormsorc:LG({n:'Штормовое чародейство',e:'Storm Sorcery',src:'Xanathar’s Guide to Everything (2017)',cv:LGCV.sorc,f:[
  {l:3,id:'ws',n:'Говорящий с ветром',e:'Wind Speaker',t:'Вы знаете Первичный язык и его диалекты.',fx:[{t:'prof',k:'lang',v:'Первичный (Primordial)'}]},
  {l:3,id:'tm',n:'Бурная магия',e:'Tempestuous Magic',t:'Бонусным действием сразу до или после сотворения заклинания 1+ круга пролетите до 10 фт без атак возможности.'},
  {l:6,id:'hs',n:'Сердце бури',e:'Heart of the Storm',t:L=>`Сопротивление электричеству и звуку. Творя заклинание 1+ круга с уроном электричеством или звуком, выбранные существа в 10 фт получают ${Math.floor(L/2)} урона электричеством или звуком.`,fx:[{t:'res',v:['электричество','звук']}]},
  {l:6,id:'sgd',n:'Повелитель бури',e:'Storm Guide',t:'Действием остановите дождь вокруг себя в радиусе 20 фт; бонусным действием меняйте направление ветра в 100 фт до конца следующего хода.'}]}),
 lunar:LG({n:'Лунное чародейство',e:'Lunar Sorcery',src:'Dragonlance: Shadow of the Dragon Queen (2022)',cv:LGCV.sorc+' Заклинания 1 и 3 уровня из книги — сразу на 3 уровне.',f:[
  {l:3,id:'le',n:'Лунное воплощение',e:'Lunar Embodiment',t:'Всегда подготовлены: «Священное пламя»; 3 ур. — Щит, Луч болезни, Сверкающие брызги, Малое восстановление, Слепота/глухота, Изменение внешности; 5 — Рассеивание магии, Прикосновение вампира, Фантомный скакун; 7 — Защита от смерти, Смятение, Галлюцинаторная местность; 9 — Телепатическая связь Рэри, Удержание чудовища, Обман. После долгого отдыха выберите фазу луны (полная, новая, растущая): раз за долгий отдых без ячейки сотворите заклинание 1 круга этой фазы (Щит / Луч болезни / Сверкающие брызги).',fx:[SP(3,['sacredflame','shield','rayofsickness','colorspray','lesserrestoration','blindnessdeafness','alterself']),SP(5,['dispelmagic','vampirictouch','phantomsteed']),SP(7,['deathward','confusion','hallucinatoryterrain']),SP(9,['rarystelepathicbond','holdmonster','mislead']),LGU('Лунное заклинание 1 круга без ячейки',L=>L>=6?3:1,'дол.')]},
  {l:3,id:'mf',n:'Лунный огонь',e:'Moon Fire',t:'«Священное пламя» может поразить одно существо или сразу два существа в 5 фт друг от друга.'},
  {l:6,id:'lb',n:'Лунные дары',e:'Lunar Boons',t:'Применяя Метамагию к заклинанию школ текущей фазы (полная — ограждение и прорицание, новая — очарование и некромантия, растущая — иллюзия и преобразование), тратьте на 1 единицу чародейства меньше (минимум 0). Использований = бонус мастерства за долгий отдых.',fx:[LGU('Лунные дары',LGPB,'дол.')]},
  {l:6,id:'ww',n:'Рост и убывание',e:'Waxing and Waning',t:'Бонусным действием за 1 единицу чародейства смените фазу луны. Теперь без ячейки можно сотворить по одному заклинанию 1 круга каждой фазы (по разу за долгий отдых), находясь в этой фазе.'}]})
});

Object.assign(CLS.warlock.subs,{
 fathomless:LG({n:'Покровитель Бездонный',e:'The Fathomless',src:'Tasha’s Cauldron of Everything (2020)',cv:LGCV.lock,f:[
  {l:3,id:'es',n:'Расширенный список заклинаний',e:'Expanded Spell List',t:'Можно подготовить как заклинания колдуна: 1 круг — Сотворение или уничтожение воды, Волна грома; 2 — Порыв ветра, Тишина; 3 — Молния, Метель; 4 — Контроль воды, Призыв элементаля (только водного); 5 — Рука Бигби (урон холодом), Конус холода.',fx:[LGLI(['createordestroywater','thunderwave','gustofwind','silence','lightningbolt','sleetstorm','controlwater','summonelemental','bigbyshand','coneofcold'])]},
  {l:3,id:'td',n:'Щупальце глубин',e:'Tentacle of the Deeps',t:L=>`Бонусным действием создайте щупальце длиной 10 фт в видимой точке в 60 фт на минуту и сразу атакуйте им: рукопашная атака заклинанием по существу в 10 фт от щупальца — ${L>=10?'2к8':'1к8'} холодом, скорость цели −10 фт до начала вашего хода. В следующие ходы одним бонусным действием переместите щупальце до 30 фт и повторите атаку. Использований = бонус мастерства за долгий отдых.`,fx:[LGU('Щупальце глубин',LGPB,'дол.')]},
  {l:3,id:'gs',n:'Дар моря',e:'Gift of the Sea',t:'Скорость плавания 40 фт; вы дышите под водой.',fx:[{t:'move',k:'плавание',v:40}]},
  {l:6,id:'os',n:'Океанская душа',e:'Oceanic Soul',t:'Сопротивление холоду. Полностью погрузившись в воду, вы понимаете любое существо, говорящее на языке, и оно понимает вас.',fx:[{t:'res',v:'холод'}]},
  {l:6,id:'gc',n:'Охранный виток',e:'Guardian Coil',t:L=>`Реакцией, когда существо в 10 фт от щупальца получает урон, уменьшите его на ${L>=10?'2к8':'1к8'}.`},
  {l:10,id:'gt',n:'Хватающие щупальца',e:'Grasping Tentacles',t:L=>`«Чёрные щупальца Эварда» всегда подготовлены; раз за долгий отдых — без ячейки. Сотворив их, получите ${L} временных хитов; урон не прерывает вашу концентрацию на этом заклинании.`,fx:[SP(10,['evardsblacktentacles']),LGU('Чёрные щупальца без ячейки',1,'дол.')]}]}),
 genie:LG({n:'Покровитель Гений',e:'The Genie',src:'Tasha’s Cauldron of Everything (2020)',cv:LGCV.lock,f:[
  {l:3,id:'gk',n:'Вид гения',e:'Genie Kind',t:'Выберите покровителя: дао (земля), джинн (воздух), ифрит (огонь) или марид (вода). Вид определяет тип урона Гнева гения и дополнительные заклинания.',fx:[CH('k','opt',1,{label:'Вид гения',pfx:'Гений',opts:[
   {v:'dao',n:'Дао',e:'Dao',t:'Урон — дробящий. Дополнительно: Убежище, Рост шипов, Слияние с камнем, Изменение формы камня, Каменная стена.',fx:[LGLI(['sanctuary','spikegrowth','meldintostone','stoneshape','wallofstone']),{t:'note',k:'genie',v:'дробящий'},{t:'res',v:'дробящий',l:6}]},
   {v:'djinni',n:'Джинн',e:'Djinni',t:'Урон — звук. Дополнительно: Волна грома, Порыв ветра, Стена ветра, Высшая невидимость, Притворство.',fx:[LGLI(['thunderwave','gustofwind','windwall','greaterinvisibility','seeming']),{t:'note',k:'genie',v:'звук'},{t:'res',v:'звук',l:6}]},
   {v:'efreeti',n:'Ифрит',e:'Efreeti',t:'Урон — огонь. Дополнительно: Огненные ладони, Палящий луч, Огненный шар, Огненный щит, Небесный огонь.',fx:[LGLI(['burninghands','scorchingray','fireball','fireshield','flamestrike']),{t:'note',k:'genie',v:'огонь'},{t:'res',v:'огонь',l:6}]},
   {v:'marid',n:'Марид',e:'Marid',t:'Урон — холод. Дополнительно: Туманное облако, Размытый образ, Метель, Контроль воды, Конус холода.',fx:[LGLI(['fogcloud','blur','sleetstorm','controlwater','coneofcold']),{t:'note',k:'genie',v:'холод'},{t:'res',v:'холод',l:6}]}]})]},
  {l:3,id:'es',n:'Расширенный список заклинаний',e:'Expanded Spell List',t:'Можно подготовить как заклинания колдуна: 1 круг — Обнаружение добра и зла; 2 — Фантомная сила; 3 — Сотворение пищи и воды; 4 — Призрачный убийца; 5 — Сотворение. Плюс по одному заклинанию каждого круга от вида гения.',fx:[LGLI(['detectevilandgood','phantasmalforce','createfoodandwater','phantasmalkiller','creation'])]},
  {l:3,id:'gv',n:'Сосуд гения',e:'Genie’s Vessel',t:(L,C)=>`Крошечный сосуд — ваша фокусировка (КД ${LGSDC(C)}, хиты ${C?L+C.pb:'уровень + мастерство'}). Укрытие в бутылке: действием исчезните внутри на время до ${C?2*C.pb:'2 × бонус мастерства'} ч (раз за долгий отдых). Гнев гения: раз в ход при попадании атакой +${C?C.pb:'бонус мастерства'} урона (${C&&C.nt.genie||'тип вида гения'}).`,fx:[LGU('Укрытие в бутылке',1,'дол.')]},
  {l:6,id:'eg',n:'Стихийный дар',e:'Elemental Gift',t:'Сопротивление урону вашего вида гения. Бонусным действием на 10 минут — полёт 30 фт с парением. Использований = бонус мастерства за долгий отдых.',fx:[LGU('Стихийный дар: полёт',LGPB,'дол.')]},
  {l:10,id:'sv',n:'Сосуд-убежище',e:'Sanctuary Vessel',t:'Укрываясь в сосуде, возьмите с собой до 5 согласных существ в 30 фт. Пробыв внутри 10 минут, каждый получает преимущества короткого отдыха и добавляет бонус мастерства к хитам, восстановленным костями хитов.'}]}),
 hexblade:LG({n:'Ведьмин клинок',e:'The Hexblade',src:'Xanathar’s Guide to Everything (2017)',cv:LGCV.lock+' «Клеймящая кара» заменена её версией 2024 года — «Сияющей карой».',f:[
  {l:3,id:'es',n:'Расширенный список заклинаний',e:'Expanded Spell List',t:'Можно подготовить как заклинания колдуна: 1 круг — Щит, Гневная кара; 2 — Размытый образ, Сияющая кара; 3 — Мерцание, Стихийное оружие; 4 — Призрачный убийца, Оглушающая кара; 5 — Изгоняющая кара, Конус холода.',fx:[LGLI(['shield','wrathfulsmite','blur','shiningsmite','blink','elementalweapon','phantasmalkiller','staggeringsmite','banishingsmite','coneofcold'])]},
  {l:3,id:'hc',n:'Проклятие ведьмина клинка',e:'Hexblade’s Curse',t:(L,C)=>`Бонусным действием проклинайте существо в 30 фт на минуту: +${C?C.pb:'бонус мастерства'} к урону по нему, критическое попадание на 19–20; если оно умирает, восстановите ${C?L+Math.max(1,C.m.cha):'уровень + мод. Хар'} хитов. Раз за короткий или долгий отдых.`,fx:[LGU('Проклятие ведьмина клинка',1,'кор./дол.')]},
  {l:3,id:'hw',n:'Ведьмин воин',e:'Hex Warrior',t:'Владение средними доспехами, щитами и воинским оружием. После долгого отдыха коснитесь оружия без свойства «двуручное», которым владеете: атаки и урон им — через Харизму, если она выше (учтено в атаках; то же для оружия договора).',fx:[{t:'prof',k:'armor',v:['medium','shield']},{t:'prof',k:'weapon',v:'martial'},CH('hw','opt',1,{label:'Ведьмин воин: оружие',pfx:'Ведьмин воин',opts:Object.keys(W).filter(id=>!W[id][6].includes('2')).map(id=>({v:id,n:W[id][0],e:W[id][1],t:`${W[id][4]} ${W[id][5]}`,fx:[{t:'note',k:'hexw',v:id}]}))})]},
  {l:6,id:'as',n:'Проклятый призрак',e:'Accursed Specter',t:L=>`Убив гуманоида, поднимите его дух как призрака (${Math.floor(L/2)} временных хитов, прибавляет мод. Хар к атакам); он служит вам до долгого отдыха. Раз за долгий отдых.`,fx:[LGU('Проклятый призрак',1,'дол.')]},
  {l:10,id:'ah',n:'Доспех проклятий',e:'Armor of Hexes',t:'Реакцией, когда проклятая вами цель попадает по вам, бросьте к6: на 4+ атака промахивается.'}]}),
 undead:LG({n:'Покровитель Нежить',e:'The Undead',src:'Van Richten’s Guide to Ravenloft (2021)',cv:LGCV.lock,f:[
  {l:3,id:'es',n:'Расширенный список заклинаний',e:'Expanded Spell List',t:'Можно подготовить как заклинания колдуна: 1 круг — Порча, Псевдожизнь; 2 — Слепота/глухота, Фантомная сила; 3 — Фантомный скакун, Разговор с мёртвыми; 4 — Защита от смерти, Высшая невидимость; 5 — Антижизненная оболочка, Смертельное облако.',fx:[LGLI(['bane','falselife','blindnessdeafness','phantasmalforce','phantomsteed','speakwithdead','deathward','greaterinvisibility','antilifeshell','cloudkill'])]},
  {l:3,id:'fd',n:'Облик ужаса',e:'Form of Dread',t:(L,C)=>`Бонусным действием на минуту: 1к10 + ${L} временных хитов; раз в ход при попадании атакой цель проходит спасбросок Мдр (Сл ${LGSDC(C)}) или испугана до конца вашего следующего хода; у вас иммунитет к испугу. Использований = бонус мастерства за долгий отдых.`,fx:[LGU('Облик ужаса',LGPB,'дол.')]},

  {l:3,id:'ad',n:'Среди мёртвых',e:'Among the Dead',t:'Вы знаете «Уход за умирающим». Преимущество на спасброски от болезней. Нежить, желающая атаковать вас, проходит спасбросок Мдр: при провале выбирает другую цель; при успехе — иммунитет к умению на 24 часа. Если вы нападёте на нежить, защита против неё пропадает.',fx:[{t:'spells',ids:['sparethedying'],ab:'cha',note:'Подкласс'}]},

  {l:6,id:'ut',n:'Рабы-мертвецы',e:'Undead Thralls',t:(L,C)=>`«Оживление мертвецов» бесплатно добавляется в книгу заклинаний (готовить его нужно как обычно) и поднимает ещё одного мертвеца. Ваша нежить получает +${L} к максимуму хитов и +${C?C.pb:'бонус мастерства'} к урону оружием.`,fx:[{t:'bookIds',ids:['animatedead']}]},

  {l:3,id:'cs',n:'Сдвиг времени',e:'Chronal Shift',t:'Реакцией, после того как вы или видимое существо в 30 фт совершили бросок атаки, проверку или спасбросок и стало ясно, успех это или провал, заставьте перебросить. 2 раза за долгий отдых.',fx:[LGU('Сдвиг времени',2,'дол.')]},

// Для этих подклассов в 2026 году вышли версии по правилам 2024 года. Пока их нет в конструкторе,

for(const [c,s,book,name] of [
 ['bard','spirits','Ravenloft: The Horrors Within (2026)',''],
 ['cleric','grave','Ravenloft: The Horrors Within (2026)',''],

 ['sorcerer','shadowmagic','Ravenloft: The Horrors Within (2026)','Shadow Sorcery'],
 ['warlock','undead','Ravenloft: The Horrors Within (2026)','Undead Patron'],

 ['fighter','arcanearcher','Arcana Unleashed (2026)',''],
 ['wizard','conjurer','Arcana Unleashed (2026)','Conjurer'],
 ['wizard','enchanter','Arcana Unleashed (2026)','Enchanter'],
 ['wizard','necromancer','Arcana Unleashed (2026)','Necromancer'],
 ['wizard','transmuter','Arcana Unleashed (2026)','Transmuter'],
 ['barbarian','ancestral','D&D: World of Warcraft (2026)','Path of the Spiritual Guardian'],
 ['monk','drunkenmaster','D&D: World of Warcraft (2026)','Warrior of Mystic Brews'],
 ['rogue','swashbuckler','D&D: World of Warcraft (2026)','']]){
 const sb=CLS[c].subs[s];

 sb.cv=(sb.cv?sb.cv+' ':'')+`Есть версия 2024 года${name?` («${name}»)`:''} в книге ${book} — по правилу совместимости приоритет у неё; эта карточка 2014 года остаётся, пока новой версии нет в конструкторе.`;
}

// ===== Подклассы 5.5e из новых книг (2025–2026) =====
const BK5={hof:['Forgotten Realms: Heroes of Faerûn (2025)','HoF'],rav:['Ravenloft: The Horrors Within (2026)','Ravenloft'],au:['Arcana Unleashed (2026)','AU'],wow:['D&D: World of Warcraft (2026)','WoW'],efa:['Eberron: Forge of the Artificer (2025)','EFA'],sfs:['Shadowfell Secrets, D&D Beyond (2026)','DDB']};
const S5=(c,id,bk,o)=>{CLS[c].subs[id]=Object.assign({exp:1,src:BK5[bk][0],tag:BK5[bk][1]},o);return CLS[c].subs[id];};
const SPNM=id=>SPL[id]?SPL[id].n:id;
const SPS=(rows,o)=>Object.assign({t:()=>'Всегда подготовлены: '+rows.map(([l,ids],i)=>(i?l:l+' ур.')+' — '+ids.map(SPNM).join(', ')).join('; ')+'.',fx:rows.map(([l,ids])=>SP(l,ids))},o);
const DC5=(C,a)=>C?String(8+C.pb+Math.max(...[].concat(a).map(x=>C.m[x]))):'8 + мастерство + мод. '+[].concat(a).map(x=>ABS[x]).join('/');
const SDC5=C=>C&&C.cast?String(C.cast.dc):'заклинаний';
const MX=(C,a,w)=>C?String(Math.max(1,C.m[a])):(w||'мод. '+ABS[a]+' (мин. 1)');
const U5=(n,v,r)=>({t:'use',n,v,r});
const SKO=(ids,fx)=>ids.map(v=>({v,n:SK[v][0],e:SK[v][1],fx:fx?fx(v):[{t:'prof',k:'skill',v}]}));

const SPIRIT_T=(L,C)=>{const d=bdie20(L),h=C?C.m.cha:'Хар';return `1 Любимый: цель восстанавливает ${d} + ${h} хитов. 2 Снайпер: ${d} + ${h} урона силовым полем. 3 Мститель: до конца вашего следующего хода попавший по цели рукопашной атакой получает ${d} урона силовым полем. 4 Отступник: цель реакцией телепортируется на 30 фт. 5 Гадалка: цель с преимуществом на проверки к20 до начала вашего хода. 6 Странник: цель получает ${d} + ${L} временных хитов и, пока они есть, скорость +10 фт. 7 Плут: спасбросок Мдр, 2${d} психической энергией и очарование до начала вашего хода (половина урона при успехе). 8 Тень: цель невидима до конца своего хода или до атаки, урона или заклинания; затем существа в 5 фт от неё — спасбросок Тел или 2${d} некротической энергией. 9 Поджигатель: спасбросок Лов, 4${d} огнём (половина при успехе). 10 Трус: цель и выбранные существа в 30 фт — спасбросок Мдр или испуганы до начала вашего хода (скорость вдвое ниже, только действие или бонусное действие). 11 Громила: выбранные существа в 30 фт от цели — спасбросок Сил, 3${d} звуком и падение ничком (половина урона при успехе). 12 Жрец: цель восстанавливает 2${d} хитов и избавляется от ослепления, очарования, глухоты, паралича, отравления или ошеломления.`;};

 {l:6,id:'uth',n:'Рабы-нежить',e:'Undead Thralls',t:(L,C)=>`«Оживление мертвецов» всегда подготовлено, раз за долгий отдых — без ячейки; круг можно поднять на 1. С книгой в руке нежить ваших заклинаний некромантии получает +${C?C.m.int+Math.floor(L/2):'Инт + половина уровня'} к хитам и максимуму; ваша нежить в 60 фт при попадании наносит доп. ${MX(C,'int')} некротической энергией.`,fx:[SP(6,['animatedead']),U5('Оживление мертвецов без ячейки',1,'дол.')]},

 {l:14,id:'dms',n:'Повелитель смерти',e:'Death’s Master',t:L=>`С книгой в руке. Укрепление нежити: бонусным действием любое число ваших существ из некромантии в 60 фт получают ${L} временных хитов (раз за долгий отдых). Угасание нежити: когда видимая нежить опускается до 0 хитов, взорвите её — к6 за половину её оставшихся костей хитов (мин. 1к6); существа в 10 фт — спасбросок Лов: некротический урон и без реакций до начала их хода, половина при успехе. Чужая нежить — реакцией и ячейкой 5+. Сл этого эффекта в книге не указана — по решению мастера (например, Сл заклинаний).`,fx:[U5('Укрепление нежити',1,'дол.')]}]});

const A4X=96/25.4,A4W=Math.round(210*A4X),A4H=Math.round(297*A4X),A4M=Math.round(8*A4X),A4CW=A4W-2*A4M,A4CH=A4H-2*A4M;

 const n=r(),done=()=>{t.textContent=n;svg.classList.toggle('crit',n===20);svg.classList.toggle('fail',n===1);b.classList.remove('spin');delete b.dataset.busy;UI.d20=n;const l=document.getElementById('d20l');if(l) l.textContent='Выпало '+n;};
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){done();return;}

async function pageJPEG(html,scale,overlays){
 const box=document.createElement('div');box.innerHTML=html;
 const x=new XMLSerializer().serializeToString(box),css=SHEET_CSS.replace(/&/g,'&amp;').replace(/</g,'&lt;');
 const Wd=Math.round(A4W*scale),Hd=Math.round(A4H*scale);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${Wd}" height="${Hd}" viewBox="0 0 ${A4W} ${A4H}"><foreignObject x="0" y="0" width="${A4W}" height="${A4H}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${A4W}px;height:${A4H}px;padding:${A4M}px;box-sizing:border-box;background:#fff;overflow:hidden"><style>${css}</style>${x}</div></foreignObject></svg>`;
 const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
 const cv=document.createElement('canvas');cv.width=Wd;cv.height=Hd;const g=cv.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,Wd,Hd);g.drawImage(img,0,0,Wd,Hd);
 // Картинки поверх: Safari не всегда рисует <img> внутри SVG
 for(const o of overlays||[]){try{const im=await loadImg(o.src),k=Wd/A4W,r=o.rad||0;
  const X=o.x*k,Y=o.y*k,Wb=o.w*k,Hb=o.h*k,ar=Wb/Hb,iar=im.naturalWidth/im.naturalHeight;
  let sx=0,sy=0,sw=im.naturalWidth,sh=im.naturalHeight;
  if(iar>ar){sw=sh*ar;sx=(im.naturalWidth-sw)/2;} else {sh=sw/ar;sy=(im.naturalHeight-sh)*o.py;}
  g.save();g.beginPath();if(g.roundRect&&r) g.roundRect(X,Y,Wb,Hb,r*k); else g.rect(X,Y,Wb,Hb);g.clip();g.drawImage(im,sx,sy,sw,sh,X,Y,Wb,Hb);g.restore();}catch(e){}}
 return {jpeg:b64u8(cv.toDataURL('image/jpeg',0.9).split(',')[1]),w:Wd,h:Hd};
}
function buildPdf(pages,state){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
 const obj=(n,fn)=>{offs[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n')};
 push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
 if(state) push('%DND24:'+u8b64(enc.encode(state))+'\n');
 const N=pages.length,Wp='595.28',Hp='841.89';
 obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
 obj(2,()=>push(`<< /Type /Pages /Kids [${pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] /Count ${N} >>`));
 pages.forEach((p,i)=>{const pn=3+i*3,cs=`q ${Wp} 0 0 ${Hp} 0 0 cm /Im${i} Do Q`;
  obj(pn,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${Wp} ${Hp}] /Resources << /XObject << /Im${i} ${pn+2} 0 R >> >> /Contents ${pn+1} 0 R >>`));
  obj(pn+1,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  obj(pn+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`);push(p.jpeg);push('\nendstream')});
 });
 const n=3+N*3,xref=len;
 push(`xref\n0 ${n}\n0000000000 65535 f \n`);for(let i=1;i<n;i++) push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
 push(`trailer\n<< /Size ${n} /Root 1 0 R /Info << /Title (D&D 2024 character sheet) /Producer (dnd2024 builder) >> >>\nstartxref\n${xref}\n%%EOF\n`);
 const out=new Uint8Array(len);let o=0;for(const b of parts){out.set(b,o);o+=b.length;}return out;
}
// Раскладка по колоночным блокам вручную: CSS-колонки внутри SVG в Safari рисуются без масштаба
function measureBlocks(cls,cw,body){
 const m=document.createElement('div');m.style.cssText=`position:absolute;left:-30000px;top:0;width:${A4CW}px;visibility:hidden`;
 m.innerHTML=`<div class="sh" style="width:${A4CW}px;margin:0"><div class="${cls}" style="width:${cw}px;columns:auto">${body}</div></div>`;
 document.body.appendChild(m);const out=[];
 for(const el of m.firstChild.firstChild.children){const cs=getComputedStyle(el);
  out.push({html:el.outerHTML,h:el.getBoundingClientRect().height+parseFloat(cs.marginTop||0)+parseFloat(cs.marginBottom||0),head:el.tagName==='H3'||el.classList.contains('lv')});}
 m.remove();return out;
}
function packColumns(blocks,cap){
 const cols=[];let cur=[],h=0;
 blocks.forEach((b,i)=>{const need=b.head&&blocks[i+1]?b.h+blocks[i+1].h:b.h;
  if(cur.length&&h+need>cap+0.5){cols.push({items:cur,h});cur=[];h=0;}
  cur.push(b.html);h+=b.h;});
 if(cur.length) cols.push({items:cur,h});
 return cols;
}
async function makePDF(C){
 const P=sheetParts(C),pages=[],gap=19;
 const shw=inner=>`<div class="sh" style="width:${A4CW}px;margin:0">${inner}</div>`;
 const m=document.createElement('div');m.style.cssText=`position:absolute;left:-30000px;top:0;width:${A4CW}px;visibility:hidden`;document.body.appendChild(m);
 const hOf=html=>{m.innerHTML=shw(html);return m.firstChild.offsetHeight;};
 try{
  m.innerHTML=shw(P.p1);const h1=m.firstChild.offsetHeight,z=h1>A4CH?A4CH/h1:1;
  pages.push({html:z<1?`<div style="zoom:${z.toFixed(4)}">${shw(P.p1)}</div>`:shw(P.p1)});
  const flow=(title,body,ncol,cls)=>{
   const fh=A4CH-hOf(title)-4,cw=(A4CW-gap*(ncol-1))/ncol;
   const blocks=measureBlocks(cls,cw,body);
   let cols=null;
   if(ncol>1){const total=blocks.reduce((a,b)=>a+b.h,0);if(total<=fh*ncol){const t=packColumns(blocks,Math.max(total/ncol,...blocks.map(b=>b.h)));if(t.length<=ncol&&t.every(c=>c.h<=fh)) cols=t;}}
   if(!cols) cols=packColumns(blocks,fh);
   for(let k=0;k<cols.length;k+=ncol){const grp=cols.slice(k,k+ncol);
    pages.push({html:shw(`${title}<div style="display:flex;align-items:flex-start;gap:${gap}px;height:${fh}px;overflow:hidden">${grp.map(c=>`<div class="${cls}" style="width:${cw}px;flex:none;columns:auto">${c.items.join('')}</div>`).join('')}</div>`)});}
  };
  flow(P.t2,P.f2,2,'ft flw');
  if(P.t3) flow(P.t3,P.top3+P.f3,1,'flw');
  // картинки поверх страницы (Safari не всегда рисует <img> внутри SVG)
  for(const p of pages){m.innerHTML=p.html;const b0=m.firstElementChild.getBoundingClientRect();p.ov=[];
   for(const im of m.querySelectorAll('img')){const r=im.getBoundingClientRect(),bw=parseFloat(getComputedStyle(im).borderTopWidth)||0;
    if(r.width<2||r.height<2) continue;p.ov.push({src:im.getAttribute('src'),x:A4M+r.left-b0.left+bw,y:A4M+r.top-b0.top+bw,w:r.width-2*bw,h:r.height-2*bw,py:parseFloat(im.dataset.py||'0.5'),rad:parseFloat(im.dataset.ovr||'0')});}}
 } finally {m.remove();}
 const imgs=[];for(const p of pages) imgs.push(await pageJPEG(p.html,2.2,p.ov));
 return buildPdf(imgs,JSON.stringify(Object.assign({},C.S,{step:0})));
}

 if(!items){UI.toast='Это не файл артефакта из конструктора.';render();return false;}
 for(const raw of items){const it=cleanItem(raw);putItem(it);if(toChar){const a=giveArt(S,it);autoEquip(a);save();}
  UI.toast=toChar?`«${it.name}» добавлен персонажу и в мастерскую.`:`«${it.name}» загружен в мастерскую.`;}
 render();return true;
}
function autoEquip(a){const it=a.item;if(it.kind!=='armor'||!ARM[it.base]) return;const C=compute(S);const cat=ARM[it.base][2];
 if(!C.prof.armor[cat]) return;if(cat==='shield') S.shield='auto'; else S.wear='x:'+a.uid;}
function readArtImg(file,iid){
 if(file.size>25e6){UI.toast='Файл слишком большой.';render();return;}
 const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,320/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*k)),hh=Math.max(1,Math.round(img.naturalHeight*k));
  const cv=document.createElement('canvas');cv.width=w;cv.height=hh;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,hh);g.drawImage(img,0,0,w,hh);
  const it=getItem(iid);if(!it) return;it.img=cv.toDataURL('image/jpeg',0.82);putItem(it);UI.toast='Картинка добавлена.';render();};
  img.onerror=()=>{UI.toast='Браузер не смог открыть картинку. Попробуйте JPG или PNG.';render();};img.src=fr.result;};
 fr.readAsDataURL(file);
}
const artFile=it=>JSON.stringify({format:'dnd24-artifact',v:1,item:it});
const artCode=it=>JSON.stringify({format:'dnd24-artifact',v:1,item:it.img&&it.img.length>40000?Object.assign({},it,{img:''}):it});
function artPreview(it){
 const eff=(it.effects||[]).map(effText).filter(Boolean).join('; ');
 const sp=(it.spells||[]).map(artSpellText).filter(Boolean).join('; ');
 const ch=it.charges&&+it.charges.n>0?`Заряды: ${it.charges.n}, восстанавливаются — ${recLabel(it.charges.rec,it.charges.rt)}.`:'';
 const meta=artMeta(it);
 return `<div class="artp">${it.img?`<img class="fimg sm" src="${it.img}" alt="">`:''}<div><b>${h(it.name)}</b>${meta?`<small>${h(meta)}</small>`:''}${it.desc?`<p>${h(it.desc)}</p>`:''}${eff?`<p>${h(eff)}</p>`:''}${sp?`<p><b>Заклинания:</b> ${h(sp)}${it.dc&&it.dc.mode==='fixed'?` (Сл ${it.dc.dc}, атака ${sgn(+it.dc.atk||0)})`:''}.</p>`:''}${ch?`<p>${h(ch)}</p>`:''}</div></div>`;
}
function rForge(){
 const L=lib();
 if(UI.edit){const it=L.find(x=>x.iid===UI.edit);if(it) return rEditor(it);UI.edit=null;}
 let s=`<main class="home forge"><button type="button" class="hb" data-a="mode" data-v="chars">‹ Персонажи</button><button type="button" class="d20b gemb" data-a="glint" aria-label="Мастерская артефактов">${GEM}</button><h1>Мастерская<span>артефактов</span></h1><p class="lead">Магические предметы: оружие, доспехи и всё остальное — с бонусами, эффектами и заклинаниями. Готовый артефакт можно выдать персонажу или отправить игроку файлом.</p>
<button type="button" class="btn pri big" data-a="fnew">Создать артефакт</button>
<h2>Ваши артефакты${L.length?` <span class="cnt">${L.length}</span>`:''}</h2>`;
 s+=L.length?`<div class="rosw">${L.map(it=>`<div class="ros"><button type="button" class="rosb" data-a="fedit" data-v="${it.iid}">${it.img?`<img class="ath" src="${it.img}" alt="">`:'<span class="ath ph" aria-hidden="true"></span>'}<span class="rt"><b>${h(it.name)}</b><span>${h(artMeta(it)||FKIND.find(k=>k[0]===it.kind)[1])}</span></span></button><button type="button" class="del${UI.fdel===it.iid?' on':''}" data-a="fdel" data-v="${it.iid}">${UI.fdel===it.iid?'Удалить?':'×'}</button></div>`).join('')}</div>`:'<p class="hint">Пока пусто.</p>';
 s+=`<h2>Загрузить артефакт</h2><div class="acts"><label class="btn">Из файла<input id="fimp" type="file" accept=".json,application/json" hidden></label><button type="button" class="btn ghost" data-a="fcodein">${UI.fcodein?'Скрыть':'По коду'}</button></div>`;
 if(UI.fcodein) s+=`<div class="codeb"><label class="fl">Вставьте код артефакта<textarea id="fcodetext" rows="4"></textarea></label><button type="button" class="btn sm" data-a="fpaste">Загрузить из кода</button></div>`;
 return s+'</main>';
}
function numIn(k,v,l,min){return `<label class="fl sm">${l}<input type="number" inputmode="numeric" data-fk="${k}" data-num="1" data-fr="1" value="${h(v)}"${min!=null?` min="${min}"`:''}></label>`}
function selIn(k,v,opts,l){return `<label class="fl sm">${l||''}<select data-fk="${k}" data-fr="1">${opts.map(([val,n])=>`<option value="${h(val)}"${String(v)===String(val)?' selected':''}>${h(n)}</option>`).join('')}</select></label>`}
function effRow(e,i){
 const p=`effects.${i}.`,lab=(ETYPES.find(x=>x[0]===e.t)||['',''])[1];let b='';
 const abO=AB.map(a=>[a,ABN[a]]);
 switch(e.t){
  case 'ab': b=selIn(p+'a',e.a,abO,'Характеристика')+numIn(p+'v',e.v,'Прибавка'); break;
  case 'abset': b=selIn(p+'a',e.a,abO,'Характеристика')+numIn(p+'v',e.v,'Становится равной'); break;
  case 'spell': b=selIn(p+'w',e.w,[['both','Атаки и Сл'],['atk','Только атаки'],['dc','Только Сл']],'К чему')+numIn(p+'v',e.v,'Бонус'); break;
  case 'res': b=selIn(p+'v',e.v,DMGT.map(x=>[x,x]),'Тип урона'); break;
  case 'sense': b=selIn(p+'k',e.k,SENSES.map(x=>[x,x]),'Вид')+numIn(p+'v',e.v,'Дальность, фт',0); break;
  case 'adv': b=`<label class="fl">На что<input data-fk="${p}v" list="advp" value="${h(e.v)}" placeholder="Например, Спасброски от яда"></label>`; break;
  case 'text': b=`<label class="fl">Описание эффекта<textarea data-fk="${p}v" rows="3" placeholder="Что именно делает предмет">${h(e.v)}</textarea></label>`; break;
  default: b=numIn(p+'v',e.v,e.t==='speed'?'Фт':'Значение');
 }
 return `<div class="eff"><div class="effh"><b>${lab}</b><button type="button" class="del" data-a="ferm" data-c="${i}" aria-label="Убрать эффект">×</button></div><div class="effr">${b}</div></div>`;
}
function spRowF(sp,i){
 const s=SPL[sp.id],n=+sp.n||0;
 const chip=(a,v,cur,lab)=>`<button type="button" data-a="${a}" data-c="${i}" data-v="${v}" class="${String(cur)===String(v)?'on':''}">${lab}</button>`;
 return `<div class="eff"><div class="effh"><b>${s.n} <i>${s.e}</i></b><button type="button" class="del" data-a="fsrm" data-c="${i}" aria-label="Убрать заклинание">×</button></div><small class="effs">${s.l?s.l+' круг':'Заговор'}; ${TM[s.t]||s.t}; ${s.r}; ${dur(s.d)}</small>
 <p class="fl sm">Сколько раз</p><div class="seg chips">${[1,2,3,4,5].map(k=>chip('fsn',k,n,k)).join('')}${chip('fsn',0,n,'Без ограничений')}</div>
 ${n>0?`<p class="fl sm">Восстанавливается</p><div class="seg chips">${[['long','Долгий отдых'],['short','Короткий отдых'],['dawn','На рассвете'],['once','Никогда'],['other','Своё']].map(([v,l])=>chip('fsrec',v,sp.rec,l)).join('')}</div>${sp.rec==='other'?`<label class="fl">Условие<input data-fk="spells.${i}.rt" value="${h(sp.rt)}" placeholder="Например, в полнолуние"></label>`:''}`:''}</div>`;
}
function migrateItem(it){let ch=false;
 for(const sp of it.spells||[]){if(sp.mode==='charges'){sp.mode='uses';sp.n=1;sp.rec=it.charges&&it.charges.rec||'long';ch=true;}if(+sp.n>5){sp.n=5;ch=true;}}
 if(it.charges&&+it.charges.n>0){it.charges.n=0;ch=true;}
 if(ch) putItem(it);return it;}
function rEditor(it){
 migrateItem(it);
 const roster_=roster();
 let s=`<main class="home forge"><button type="button" class="hb" data-a="fback">‹ Все артефакты</button><h1>${h(it.name)||'Без названия'}</h1>`;
 s+=`<div class="porw">${it.img?`<img class="fimg" src="${it.img}" alt="">`:'<div class="pempty fimg">Нет картинки</div>'}<div class="pact"><label class="btn">${it.img?'Заменить картинку':'Добавить картинку'}<input id="fimgin" type="file" accept="image/*" hidden></label>${it.img?'<button type="button" class="btn ghost" data-a="fimgdel">Убрать</button>':''}</div></div>`;
 s+=`<label class="fl">Название<input data-fk="name" value="${h(it.name)}" maxlength="80" placeholder="Например, Клинок рассвета"></label>`;
 s+=`<p class="fl">Тип</p>`+seg('fkind',it.kind,FKIND);
 if(it.kind==='weapon') s+=selIn('base',it.base,Object.keys(W).map(id=>[id,`${W[id][0]} — ${W[id][4]} ${W[id][5]}`]),'Основа (обычное оружие)');
 if(it.kind==='armor') s+=selIn('base',it.base,Object.keys(ARM).map(id=>[id,ARM[id][2]==='shield'?`${ARM[id][0]} — КД +2`:`${ARM[id][0]} — КД ${ARM[id][3]}`]),'Основа (обычный доспех)');
 if(it.kind!=='other') s+=`<p class="fl">Магический бонус ${it.kind==='weapon'?'(к атаке и урону)':'(к КД)'}</p>`+seg('fbonus',it.bonus,[[0,'Нет'],[1,'+1'],[2,'+2'],[3,'+3']]);
 s+=`<div class="effr">${selIn('rarity',it.rarity,RARITY.map(r=>[r,r||'Не указана']),'Редкость')}</div>`;
 s+=`<p class="fl">Настройка</p>`+seg('fatt',it.attune?1:0,[[0,'Не нужна'],[1,'Требует настройки']]);
 s+=`<label class="fl">Описание<textarea data-fk="desc" rows="4" placeholder="Как выглядит, откуда взялся, особые свойства">${h(it.desc)}</textarea></label>`;
 s+=`<h2>Эффекты</h2>`+(it.effects.length?it.effects.map(effRow).join(''):'<p class="hint">Пока нет. Эффекты активного артефакта сами учитываются в листе персонажа.</p>')+
  `<label class="fl"><select data-fadd="1"><option value="">+ Добавить эффект…</option>${ETYPES.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></label><datalist id="advp">${ADVP.map(x=>`<option value="${h(x)}">`).join('')}</datalist>`;
  s+=`<h2>Заклинания</h2>`+it.spells.map(spRowF).join('');
 s+=`<button type="button" class="btn" data-a="fsp">${UI.fsp?'Скрыть список':'+ Добавить заклинание'}</button>`;
 if(UI.fsp) s+=`<input class="srch" type="search" placeholder="Поиск по названию" data-f="f-fsp" value="${h(UI.filter['f-fsp']||'')}"><div id="f-fsp" class="fsp">${SPLA.map(sp=>`<button type="button" class="opt sp" data-a="fsadd" data-v="${sp.id}" data-s="${h((sp.n+' '+sp.e).toLowerCase())}"><span class="mk plus">+</span><span class="ob"><span class="on1"><b>${sp.n}</b> <i>${sp.e}</i></span><small>${sp.l?sp.l+' круг':'Заговор'}, ${SCHOOL[sp.s].toLowerCase()}</small></span></button>`).join('')}</div>`;
 if(it.spells.length) s+=`<p class="fl">Сл и атака заклинаний предмета</p>`+seg('fdc',it.dc.mode,[['owner','Как у владельца'],['fixed','Свои значения']])+(it.dc.mode==='fixed'?`<div class="effr">${numIn('dc.dc',it.dc.dc,'Сл спасброска',1)}${numIn('dc.atk',it.dc.atk,'Бонус атаки')}</div>`:'');
 s+=`<h2>Как будет на листе</h2>${artPreview(it)}`;
 s+=`<h2>Выдать</h2><p class="hint">Добавит копию артефакта в инвентарь выбранного персонажа на этом устройстве.</p>`+(roster_.length?`<div class="rosw">${roster_.map(e=>`<div class="ros"><button type="button" class="rosb" data-a="fgive" data-c="${e.id}">${porImg('av',e.st)||'<span class="av ph" aria-hidden="true"></span>'}<span class="rt"><b>${h(e.name)}</b><span>${h(e.sum)}</span></span></button></div>`).join('')}</div>`:'<p class="hint">Пока нет персонажей на этом устройстве.</p>');
 s+=`<h2>Отправить игроку</h2><div class="acts"><button type="button" class="btn pri" data-a="fdl">Скачать файл артефакта</button><button type="button" class="btn ghost" data-a="fcode">${UI.fcode?'Скрыть код':'Код артефакта'}</button></div><p class="hint">Игрок загружает файл на главной («Загрузить» → «Из PDF или файла»), в мастерской или прямо в снаряжении персонажа.</p>`;
 if(UI.fcode) s+=`<div class="codeb"><label class="fl">Код артефакта${it.img&&it.img.length>40000?' (без картинки — она слишком большая для кода)':''}<textarea id="fcodeout" rows="4" readonly>${h(artCode(it))}</textarea></label><button type="button" class="btn sm" data-a="fcopy">Скопировать код</button></div>`;
 s+=`<div class="acts" style="margin-top:26px"><button type="button" class="btn ghost" data-a="fdel" data-v="${it.iid}">${UI.fdel===it.iid?'Точно удалить? Нажмите ещё раз':'Удалить артефакт'}</button></div>`;
 return s+'</main>';
}
function rArts(C){
 const L=lib();
 let s=`<h2>Артефакты</h2>`;
 if(!C.arts.length) s+='<p class="hint">Пока нет. Добавьте из мастерской или загрузите файл артефакта от мастера.</p>';
 else s+=C.arts.map(a=>{const it=a.item,src=L.find(x=>x.iid===it.iid),upd=src&&(src.at||0)>(it.at||0);
  return `<div class="inv"><div class="ib"><div class="arth">${it.img?`<img class="ath" src="${it.img}" alt="">`:''}<b>${h(it.name)}</b>${a.on!==false?' <i class="tag">активен</i>':''}</div><small>${h(artMeta(it))}</small><div class="seg mini">${[['1','Активен'],['0','Не активен']].map(([v,n])=>`<button type="button" data-a="aon" data-c="${a.uid}" data-v="${v}" class="${(a.on!==false?'1':'0')===v?'on':''}">${n}</button>`).join('')}</div>${upd?`<button type="button" class="btn sm" data-a="aupd" data-c="${a.uid}">Обновить из мастерской</button>`:''}</div><button type="button" class="del${UI.adel===a.uid?' on':''}" data-a="arm" data-c="${a.uid}">${UI.adel===a.uid?'Убрать?':'×'}</button></div>`;}).join('');
 s+=`<p class="hint">Эффекты, бонусы и заклинания активных артефактов сами учитываются в листе.</p><div class="acts">${L.length?`<button type="button" class="btn" data-a="apick">${UI.apick?'Скрыть мастерскую':'Добавить из мастерской'}</button>`:''}<label class="btn ghost">Загрузить файл артефакта<input id="artin" type="file" accept=".json,application/json" hidden></label></div>`;
 if(UI.apick) s+=L.map(it=>opt({a:'aadd',v:it.iid,n:h(it.name),m:h(artMeta(it)),t:h(it.desc||'')})).join('');
 return s;
}
function forgeAct(a,c,v){
 const it=UI.edit?getItem(UI.edit):null,save_=()=>{if(it) putItem(it);};
 switch(a){
  case 'forge': UI.view='forge';UI.edit=null;UI.fdel=null;SET.mode='forge';saveSet();return 'nav';
  case 'fnew': {const n=newItem();putItem(n);UI.edit=n.iid;UI.fsp=0;UI.fcode=0;return 'nav';}
  case 'fedit': UI.edit=v;UI.fsp=0;UI.fcode=0;UI.fdel=null;return 'nav';
  case 'fback': UI.edit=null;UI.fdel=null;return 'nav';
  case 'fcodein': UI.fcodein=UI.fcodein?0:1;return;
  case 'fdel': if(UI.fdel!==v){UI.fdel=v;return;}setLib(lib().filter(x=>x.iid!==v));UI.fdel=null;if(UI.edit===v) UI.edit=null;UI.toast='Артефакт удалён из мастерской.';return 'nav';
  case 'fkind': if(it){it.kind=v;if(v==='weapon'&&!W[it.base]) it.base='longsword';if(v==='armor'&&!ARM[it.base]) it.base='chainmail';save_();}return;
  case 'fbonus': if(it){it.bonus=+v;save_();}return;
  case 'fatt': if(it){it.attune=v==='1';save_();}return;
  case 'ferm': if(it){it.effects.splice(+c,1);save_();}return;
  case 'fsp': UI.fsp=UI.fsp?0:1;return;
  case 'fsadd': if(it){it.spells.push({id:v,mode:'uses',n:1,cost:1,rec:'long',rt:''});UI.fsp=0;save_();UI.toast=SPL[v].n+' — добавлено.';}return;
  case 'fsrm': if(it){it.spells.splice(+c,1);save_();}return;
  case 'fsn': if(it&&it.spells[+c]){it.spells[+c].n=+v;it.spells[+c].mode='uses';save_();}return;
  case 'fsrec': if(it&&it.spells[+c]){it.spells[+c].rec=v;save_();}return;
  case 'fdc': if(it){it.dc.mode=v;save_();}return;
  case 'fimgdel': if(it){it.img='';save_();}return;
  case 'fcode': UI.fcode=UI.fcode?0:1;return;
  case 'fgive': {if(!it) return;const r=roster(),e=r.find(x=>x.id===c);if(!e) return;
   if(S.rid===c){const ar=giveArt(S,it);autoEquip(ar);save();} else {giveArt(e.st,it);e.sum=summaryOf(e.st);setRoster(r);}
   UI.toast=`«${it.name}» выдан: ${e.name}.`;return;}
  case 'aadd': {const src=getItem(v);if(!src) return;const ar=giveArt(S,src);autoEquip(ar);UI.apick=0;UI.toast=`«${src.name}» добавлен в инвентарь.`;return;}
  case 'aon': {const x=(S.arts||[]).find(z=>z.uid===c);if(x) x.on=v==='1';return;}
  case 'arm': if(UI.adel!==c){UI.adel=c;return;}S.arts=(S.arts||[]).filter(z=>z.uid!==c);if(S.wear==='x:'+c) S.wear='auto';UI.adel=null;UI.toast='Артефакт убран из инвентаря.';return;
  case 'aupd': {const x=(S.arts||[]).find(z=>z.uid===c),src=x&&getItem(x.item.iid);if(src){x.item=JSON.parse(JSON.stringify(src));UI.toast='Артефакт обновлён.';}return;}
  case 'apick': UI.apick=UI.apick?0:1;return;
 }
 return 'none';
}
function forgeClick(a){
 const it=UI.edit?getItem(UI.edit):null;
 if(a==='fdl'&&it){saveFile((it.name||'артефакт').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,60)+'.artifact.json',artFile(it));return true;}
 if(a==='fcopy'){const ta=document.getElementById('fcodeout');if(!ta) return true;(async()=>{let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(e){try{ta.focus();ta.select();ok=document.execCommand('copy');}catch(_){}}UI.toast=ok?'Код артефакта скопирован.':'Выделите код и скопируйте вручную.';render();})();return true;}
 if(a==='fpaste'){const t=document.getElementById('fcodetext');importArtifact(t?t.value:'',false);UI.fcodein=0;return true;}
 return false;
}
function forgeChange(t){
 if(t.id==='fimgin'){const f=t.files&&t.files[0];t.value='';if(f&&UI.edit) readArtImg(f,UI.edit);return true;}
 if(t.id==='fimp'||t.id==='artin'){const f=t.files&&t.files[0];t.value='';if(!f) return true;const fr=new FileReader();fr.onload=()=>importArtifact(fr.result,t.id==='artin');fr.readAsText(f);return true;}
 if(t.dataset.fadd){const ty=t.value;if(!ty) return true;const it=getItem(UI.edit);if(it){it.effects.push(JSON.parse(JSON.stringify(EDEF[ty])));putItem(it);}render();return true;}
 if(t.dataset.fk){forgeInput(t,true);return true;}
 return false;
}
function forgeInput(t,isChange){
 const it=getItem(UI.edit);if(!it) return true;
 let v=t.value;if(t.dataset.num) v=v===''?0:+v;
 setP(it,t.dataset.fk,v);putItem(it);
 if(isChange&&t.dataset.fr) render();
 return true;
}

init();
</script>
