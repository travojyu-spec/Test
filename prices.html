<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="cloud.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#21443a">
<title>Прейскурант авантюриста — цены D&amp;D 5.5</title>
<style>
:root{
  --paper:#e7ebe2;--sheet:#f4f6f0;--ink:#1b2922;--ink2:#56665d;--rule:#c2ced7;--margin:#b3433b;
  --felt:#21443a;--felt2:#2d5d4d;--on-felt:#eef3ec;
  --cu:#a4552a;--ag:#6b7783;--el:#827c2c;--au:#94730f;--pt:#4b7480;--hl:#f1e2a2;--warn:#8f3a20;
  --serif:"Noto Serif","Droid Serif","Source Serif Pro",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,Roboto,"Segoe UI","Noto Sans",Arial,sans-serif;
  --hh:56px;--tab-on:#21443a;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1a16;--sheet:#17251f;--ink:#e1e7dc;--ink2:#9daea4;--rule:#29423a;--margin:#d06a60;
  --felt:#1b372e;--felt2:#6fb39a;--on-felt:#e5ece2;
  --cu:#dc9265;--ag:#bcc6cf;--el:#cdc67d;--au:#e3bf52;--pt:#9ccbd5;--hl:#3d3a1c;--warn:#f08d6a;--tab-on:#2f6352;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1a16;--sheet:#17251f;--ink:#e1e7dc;--ink2:#9daea4;--rule:#29423a;--margin:#d06a60;
  --felt:#1b372e;--felt2:#6fb39a;--on-felt:#e5ece2;
  --cu:#dc9265;--ag:#bcc6cf;--el:#cdc67d;--au:#e3bf52;--pt:#9ccbd5;--hl:#3d3a1c;--warn:#f08d6a;--tab-on:#2f6352;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hh) + 60px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);min-height:100%;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--felt)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--au);outline-offset:2px}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:4px;padding:7px 8px;background:var(--felt);color:var(--on-felt)}
.brand{flex:1;min-width:0;text-decoration:none;font:600 19px/1.1 var(--serif);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:400 11px/1.3 var(--sans);opacity:.72}
.ib{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:rgba(255,255,255,.12)}
.reg{position:relative;flex:0 0 auto}
.reg select{appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:var(--on-felt);font:600 13px var(--sans);border-radius:10px;padding:8px 26px 8px 10px;max-width:132px;min-height:40px}
.reg::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;opacity:.8}
.reg option{color:#1b2922;background:#fff}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#mstrip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;background:var(--hl);color:var(--ink);font-size:13px}
#mstrip button{border:1px solid var(--ink2);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap}

/* page with ledger margin */
main{max-width:760px;margin:0 auto;padding:0 14px 128px 28px;position:relative}
main::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.5}

/* home */
.hero{padding:28px 0 6px}
.hero h1{font:600 36px/1.05 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
.hero p{margin:0 0 14px;color:var(--ink2);max-width:58ch}
.coins{display:flex;gap:4px;overflow-x:auto;padding:4px 0 12px;margin-right:-14px;scrollbar-width:none}
.coins::-webkit-scrollbar{display:none}
.coin{flex:1 1 0;display:flex;flex-direction:column;align-items:center;min-width:58px;text-align:center}
.disc{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--serif);color:var(--paper);margin-bottom:5px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.18)}
.disc.cu{background:var(--cu)}.disc.ag{background:var(--ag)}.disc.el{background:var(--el)}.disc.au{background:var(--au)}.disc.pt{background:var(--pt)}
.coin-n{font-size:12px;font-weight:600}
.coin-r{font-size:11px;color:var(--ink2)}
.gauge{font:italic 15px/1.5 var(--serif);color:var(--ink)!important;border-left:3px solid var(--au);padding-left:10px}
.sbig{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:12px 14px;color:var(--ink2);font-size:15px;margin:4px 0 6px}
.index{margin-top:14px;border-top:1px solid var(--rule)}
.ix{display:grid;grid-template-columns:34px 1fr;column-gap:10px;padding:12px 2px;border-bottom:1px solid var(--rule);text-decoration:none}
.ix:active{background:var(--sheet)}
.ix-i{grid-row:1/3;font-size:22px;align-self:center}
.ix-t{font:600 19px/1.2 var(--serif)}
.ix-t small,.sh h1 small,.grp h2 small,.tb small{font-family:var(--sans);font-weight:400;color:var(--ink2)}
.ix-t small{font-size:12px}
.ix-d{font-size:13.5px;color:var(--ink2)}
.foot{font-size:12px;color:var(--ink2);margin-top:22px}

/* section */
.sh h1{font:600 30px/1.1 var(--serif);margin:22px 0 6px}
.sh h1 small{display:block;font-size:13px;margin-top:4px}
.intro{color:var(--ink2);margin:0 0 12px;font-size:14px;max-width:62ch}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:5;display:flex;gap:6px;overflow-x:auto;margin:0 -14px 0 -28px;padding:8px 14px 9px 28px;background:var(--paper);border-bottom:1px solid var(--rule);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;background:var(--sheet);font-size:14px;line-height:1.15;min-height:42px}
.tb small{font-size:10.5px}
.tb.on{background:var(--tab-on);color:var(--on-felt);border-color:var(--tab-on)}
.tb.on small{color:inherit;opacity:.75}
.tiered .tb{border-radius:10px;padding:6px 11px 6px}
.pips{display:flex;gap:3px;margin-bottom:4px;height:6px}
.pips i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.18}
.pips i.f{opacity:1;background:var(--au)}
.pips i.x{opacity:0}
.tb.on .pips i.f{background:#e3bf52}
.note{margin:14px 0 4px;padding:10px 12px;background:var(--sheet);border-left:3px solid var(--felt2);border-radius:0 10px 10px 0;font-size:14px;max-width:66ch}
.grp{margin-top:20px}
.grp h2{font:600 20px/1.2 var(--serif);margin:0 0 5px}
.grp h2 small{font-size:12px;margin-left:4px}
.gnote{margin:0 0 6px;font-size:13px;color:var(--ink2)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto 34px;column-gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--rule)}
.it-n{font-weight:600;font-size:15px;line-height:1.3}
.it-u{font-weight:400;color:var(--ink2);font-size:12.5px}
.it-e{font-size:12px;color:var(--ink2);font-style:italic}
.it-d{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35}
.it-p{text-align:right;font-variant-numeric:tabular-nums;max-width:46vw;padding-top:1px}
.pr{font-weight:650;font-size:15px;line-height:1.3}
.mo{display:block;font-size:11.5px;color:var(--ink2);font-weight:400;margin-top:1px}
.mo .cn i{font-weight:500}
.src.c{border-color:transparent;padding-right:0;opacity:.8}
.src{display:inline-block;margin-top:4px;font-size:10.5px;color:var(--ink2);border:1px solid var(--rule);border-radius:5px;padding:0 5px;line-height:1.55;white-space:nowrap}
.add{width:32px;height:32px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);color:var(--felt2);font-size:19px;line-height:1;display:grid;place-items:center;padding:0;margin-top:-2px}
.add:active{background:var(--felt);color:var(--on-felt)}
.flash{animation:fl 2.2s ease-out}
@keyframes fl{0%,35%{background:var(--hl)}100%{background:transparent}}

/* coins in text: the one bold element */
.cn{white-space:nowrap}
.cn i{font-style:normal;font-size:.8em;font-weight:650;margin-left:2px;color:var(--m)}
.cn i::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--m);margin-right:2px;vertical-align:.04em;box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.cn.au{--m:var(--au)}.cn.ag{--m:var(--ag)}.cn.cu{--m:var(--cu)}
.cn.free{color:var(--felt2);font-weight:650}
.dash{color:var(--ink2);margin:0 2px}
.inf{font-style:italic;font-family:var(--serif);color:var(--au)}
.txt{font-weight:600;white-space:normal}

/* calculators */
.calc{margin:14px 0 6px;padding:14px 12px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
.f{display:block;margin-bottom:11px}
.f>span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
select,input[type=number],input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 10px;min-height:44px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{border:0;padding:0;margin:0 0 8px}
.chk legend{font-size:12.5px;color:var(--ink2);padding:0;margin-bottom:2px}
.chk label{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--rule)}
.chk label:last-child{border-bottom:0}
.chk em{color:var(--ink2);font-style:normal;margin-left:auto;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--felt2);flex:0 0 auto}
.out{display:block;border-top:2px solid var(--felt2);padding-top:12px;margin-top:6px}
.big{font:650 30px/1.2 var(--sans);font-variant-numeric:tabular-nums}
.calc-sub{font-size:13px;color:var(--ink2);margin-top:5px}
.warn{margin-top:8px;font-size:13px;color:var(--warn)}
.srcs{margin-top:14px;border-top:1px solid var(--rule)}
.srow{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.srow .src{margin:0;min-width:58px;text-align:center}

/* bill */
#billbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.billbtn{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;border:0;background:var(--tab-on);color:var(--on-felt);font-weight:600;box-shadow:0 8px 22px rgba(8,24,18,.32);max-width:100%}
.billbtn b{background:#e3bf52;color:#1b2922;border-radius:999px;padding:0 7px;font-size:12px;line-height:1.6}
.billbtn .cn.au{--m:#e8c55a}.billbtn .cn.ag{--m:#cdd5dc}.billbtn .cn.cu{--m:#e8a47a}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(6,14,10,.5);display:flex;align-items:flex-end}
.sheet-in{background:var(--paper);width:100%;max-width:760px;margin:0 auto;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{font:600 22px var(--serif);margin:0}
.txtbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:14px}
#blist{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--rule)}
.bl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.bl-n{font-weight:600;font-size:14.5px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);padding:0;font-size:17px;line-height:1}
.qty span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.bl .pr{text-align:right;min-width:72px}
.empty{padding:14px 0;color:var(--ink2);font-size:14px;list-style:none}
.split{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:14px}
.split input{width:72px;min-height:38px}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:15px}
.sumrow:first-child{font-size:17px}
.sheet-a{margin-top:12px;display:flex;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* search */
.ov{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--felt)}
.ov-bar input{flex:1;background:var(--sheet);border-color:transparent}
.ov-bar .txtbtn{background:transparent;color:var(--on-felt);border-color:rgba(255,255,255,.3)}
#qres{list-style:none;margin:0 auto;padding:0 14px 40px;max-width:760px}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px 0}
.sr-m{display:flex;flex-direction:column}
.sr .pr{text-align:right;max-width:44vw}


/* generator */
.gtop{margin-top:14px}
.gsaved{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.gl{font-size:12.5px;color:var(--ink2);margin-right:2px}
.gs{display:inline-flex;align-items:stretch;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);overflow:hidden}
.gs button{border:0;background:none;padding:6px 4px 6px 12px;font-size:13px;max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs .gx{padding:6px 10px 6px 6px;color:var(--ink2);font-size:16px;line-height:1}
.gtiers{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 0 0;padding:2px 14px 4px 0}
.gtiers::-webkit-scrollbar{display:none}
.gt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:0;min-height:52px;padding:7px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);text-align:left;line-height:1.15}
.gt span{font-size:14px;font-weight:600}
.gt small{font-size:10.5px;color:var(--ink2)}
.gt.on{background:var(--tab-on);border-color:var(--tab-on);color:var(--on-felt)}
.gt.on small{color:inherit;opacity:.75}
.gt.on .pips i.f{background:#e3bf52}
.gdesc{margin:8px 0 10px;font-size:14px;color:var(--ink2)}
.gacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gb{min-height:44px;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:6px 8px;font-size:13.5px;font-weight:600;line-height:1.2}
.gb.pri{grid-column:1/-1;background:var(--tab-on);border-color:var(--tab-on);color:var(--on-felt);font-size:15px}
.gb:active{transform:translateY(1px)}
.shop{margin:18px 0 8px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:18px 14px 8px;box-shadow:0 1px 0 var(--rule)}
.shop-h{text-align:center;padding:0 4px 14px;margin:0 0 4px;border-bottom:3px double var(--rule)}
.shop-h h2{font:600 clamp(24px,7vw,34px)/1.12 var(--serif);margin:0;text-wrap:balance}
.shop-t{margin:6px 0 0;font:italic 14px var(--serif);color:var(--ink2)}
.dm{margin:12px 0 4px;padding:10px 12px;border:1px dashed var(--rule);border-radius:10px;font-size:13.5px;display:grid;gap:6px}
.dm div{display:grid;grid-template-columns:96px 1fr;gap:8px}
.dm dt{color:var(--ink2);font-size:12.5px;padding-top:1px}
.dm dd{margin:0}
.shop .grp{margin-top:16px}
.shop .grp h2{font-size:18px;text-align:center}
.shop .grp h2 small{display:block;margin:2px 0 0}
.shop .list{border-top:0}
.shop .it:last-child{border-bottom:0}
.hclose{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);z-index:12;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
body.handout .bar,body.handout .tabs,body.handout .sh,body.handout .gtop,body.handout .dm,body.handout .add,body.handout #billbar{display:none!important}
body.handout .hclose{display:block}
body.handout main::before{display:none}
body.handout main{padding:12px 10px 90px}
body.handout .shop{margin-top:0;font-size:16px}
body.handout .it{grid-template-columns:minmax(0,1fr) auto}
body.handout .it-n{font-size:16.5px}
body.handout .pr{font-size:16.5px}


/* info cards */
.nm{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:3px}
.ii{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:5px;border-radius:50%;font:italic 600 10.5px/1 var(--serif);border:1px solid var(--rule);color:var(--ink2);vertical-align:2px}
.nm:active .ii{background:var(--felt);color:var(--on-felt);border-color:var(--felt)}
#ibody{padding-top:4px}
.ihead h2{font:600 24px/1.15 var(--serif);margin:2px 0 0;padding-right:4px}
.isub{margin:2px 0 0;font-size:13px;color:var(--ink2);font-style:italic}
.imeta{margin:6px 0 0;font-size:14px;color:var(--ink2)}
.imeta::first-letter{text-transform:uppercase}
.ikv{margin:14px 0 0;border-top:1px solid var(--rule)}
.ikv div{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.ikv dt{color:var(--ink2)}
.ikv dd{margin:0}
.ikv dd small{color:var(--ink2);font-size:12px;margin-left:4px}
.igl p{font-size:13px;line-height:1.45;color:var(--ink2);margin:8px 0 0}
.igl b{color:var(--ink);font-weight:600}
.idesc{font-size:15.5px;line-height:1.5;margin:14px 0 0;max-width:62ch}
.idesc b{font-weight:600}
.inote{font:italic 14.5px/1.45 var(--serif);color:var(--ink2);margin:10px 0 0}
.iprice{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:16px 0 0;padding:10px 12px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;font-size:15px}
.iprice .pr{text-align:right}
.isrc{font-size:12.5px;color:var(--ink2);margin:10px 0 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.isrc .src{margin:0}
.ilegal{font-size:11.5px;color:var(--ink2);margin:6px 0 0;opacity:.8}
.iacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.iacts .gb.pri{grid-column:auto}
.iacts .gb:only-child{grid-column:1/-1}

<script>
(function(){
'use strict';
var app=document.getElementById('app');
var MET={p:1000,g:100,e:50,s:10,c:1};
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var REGIONS=[['city','Город',1],['capital','Столица',1.25],['town','Городок',1],['village','Деревня',0.9],['frontier','Фронтир',1.5],['remote','Глушь',2],['siege','Осада, голод',3],['black','Чёрный рынок',1.5]];
var region=store.get('pr_region','city');
if(!REGIONS.some(function(r){return r[0]===region}))region='city';
function reg(){for(var i=0;i<REGIONS.length;i++)if(REGIONS[i][0]===region)return REGIONS[i];return REGIONS[0]}
function mult(){return reg()[2]}

function val(s){var t=0;String(s).replace(/(\d+(?:\.\d+)?)([pgesc])/g,function(m,n,u){t+=parseFloat(n)*MET[u];return m});return t}
function parse(p){
  if(p==null||p==='')return null;p=String(p);
  if(p==='0')return{k:'free'};
  if(p==='∞')return{k:'inf'};
  if(p.charAt(0)==='#')return{k:'txt',s:p.slice(1)};
  var parts=p.split('-');
  if(parts.length===2)return{k:'r',a:val(parts[0]),b:val(parts[1])};
  return{k:'v',v:val(p)};
}
function nf(n){return n.toLocaleString('ru-RU')}
function tok(n,m,u){return '<span class="cn '+m+'">'+nf(n)+'<i>'+u+'</i></span>'}
function coins(v){
  v=Math.round(v);
  if(v<=0)return '<span class="cn free">даром</span>';
  var g=Math.floor(v/100),s=Math.floor(v%100/10),c=v%10;
  if(v>=100000){g=Math.round(v/100);s=0;c=0}
  else if(v>=1000){var t=Math.round(v/10);g=Math.floor(t/10);s=t%10;c=0}
  var o=[];if(g)o.push(tok(g,'au','зм'));if(s)o.push(tok(s,'ag','см'));if(c)o.push(tok(c,'cu','мм'));
  return o.join(' ');
}
function priceHTML(pp,m){
  if(!pp)return '';
  if(pp.k==='v')return coins(pp.v*m);
  if(pp.k==='r')return coins(pp.a*m)+'<span class="dash">–</span>'+coins(pp.b*m);
  if(pp.k==='free')return '<span class="cn free">даром</span>';
  if(pp.k==='inf')return '<span class="inf">бесценно</span>';
  return '<span class="txt">'+pp.s+'</span>';
}

/* index */
var INDEX={},FLAT=[];
SECTIONS.forEach(function(sec){sec.tabs.forEach(function(tab){(tab.groups||[]).forEach(function(g,gi){g.items.forEach(function(it,ii){
  var id=[sec.id,tab.id,gi,ii].join('.');
  var raw=(it[2]!=null&&it[2]!=='')?it[2]:g.price;
  var rec={id:id,sec:sec,tab:tab,g:g,it:it,pp:parse(raw),src:it[5]||g.src,unit:(it[3]!=null&&it[3]!=='')?it[3]:(g.unit||'')};
  INDEX[id]=rec;FLAT.push(rec);
})})})});
function findSec(id){for(var i=0;i<SECTIONS.length;i++)if(SECTIONS[i].id===id)return SECTIONS[i];return null}

function srcBadge(code){return code&&SRC[code]?'<span class="src'+(code==='C'?' c':'')+'">'+SRC[code][0]+'</span>':''}
function row(r){
  var it=r.it,m=mult(),pp=r.pp;
  var mo='';
  if(r.g.per==='day'&&r.unit==='день'&&pp&&pp.k==='v'&&pp.v>0)mo='<span class="mo">≈ '+coins(pp.v*30*m)+' в месяц</span>';
  var add=pp&&pp.k==='v'&&pp.v>0?'<button class="add" type="button" data-add="'+r.id+'" aria-label="Добавить в счёт: '+it[0]+'">+</button>':'<span></span>';
  return '<li class="it" id="i-'+r.id+'"><div class="it-m"><div class="it-n">'+nameHTML(r,it[0],'')+(r.unit?' <span class="it-u">'+r.unit+'</span>':'')+'</div>'+
    (it[1]?'<div class="it-e" lang="en">'+it[1]+'</div>':'')+(it[4]?'<div class="it-d">'+it[4]+'</div>':'')+'</div>'+
    '<div class="it-p"><div class="pr">'+priceHTML(pp,m)+'</div>'+mo+srcBadge(r.src)+'</div>'+add+'</li>';
}
function group(sec,tab,g,gi){
  var rows=g.items.map(function(it,ii){return row(INDEX[[sec.id,tab.id,gi,ii].join('.')])}).join('');
  return '<section class="grp"><h2>'+g.t+(g.e?' <small lang="en">'+g.e+'</small>':'')+'</h2>'+(g.note?'<p class="gnote">'+g.note+'</p>':'')+'<ul class="list">'+rows+'</ul></section>';
}
function pips(lv){if(!lv)return '<span class="pips" aria-hidden="true"><i class="x"></i></span>';var s='';for(var i=1;i<=6;i++)s+='<i'+(i<=lv?' class="f"':'')+'></i>';return '<span class="pips" aria-hidden="true">'+s+'</span>'}

/* views */
var COINS=[['мм','Медь','Copper','cu','основа'],['см','Серебро','Silver','ag','10 мм'],['эм','Электрум','Electrum','el','5 см'],['зм','Золото','Gold','au','10 см'],['пм','Платина','Platinum','pt','10 зм']];
function home(){
  document.title='Прейскурант авантюриста — цены D&D 5.5';
  var c=COINS.map(function(k){return '<div class="coin"><span class="disc '+k[3]+'">'+k[0]+'</span><span class="coin-n">'+k[1]+'</span><span class="coin-r">'+k[4]+'</span></div>'}).join('');
  var ix=SECTIONS.map(function(s){return '<a class="ix" href="#'+s.id+'"><span class="ix-i" aria-hidden="true">'+s.ic+'</span><span class="ix-t">'+s.t+' <small lang="en">'+s.e+'</small></span><span class="ix-d">'+s.d+'</span></a>'}).join('');
  app.innerHTML='<section class="hero"><h1>Сколько это стоит?</h1><p>Цены D&amp;D 5.5 (правила 2024) от кружки эля до воскрешения. У каждой цены есть пометка: официальная книга, расчёт от неё или исторический аналог.</p>'+
  '<div class="coins" aria-label="Монеты">'+c+'</div>'+
  '<p class="gauge">1 зм — это 5 дней работы чернорабочего, полдня работы мастера, 25 кружек эля или 2 ночи в скромной гостинице.</p>'+
  '<button class="sbig" type="button" data-search>Найти цену: эль, латы, воскрешение…</button></section>'+
  '<nav class="index" aria-label="Разделы">'+ix+'</nav>'+
  '<p class="foot">Неофициальный фанатский справочник. Dungeons &amp; Dragons — товарный знак Wizards of the Coast.</p>';
}
function section(sec,tabId){
  var tab=null;for(var i=0;i<sec.tabs.length;i++)if(sec.tabs[i].id===tabId)tab=sec.tabs[i];
  if(!tab)tab=sec.tabs[0];
  document.title=sec.t+' — Прейскурант авантюриста';
  var tabs=sec.tabs.map(function(t){var on=t===tab;return '<a role="tab" class="tb'+(on?' on':'')+'" aria-selected="'+on+'" href="#'+sec.id+'/'+t.id+'">'+(sec.tiered?pips(t.lv):'')+'<span>'+t.t+'</span><small lang="en">'+t.e+'</small></a>'}).join('');
  var body='';
  if(tab.note)body+='<div class="note">'+tab.note+'</div>';
  if(tab.custom&&CUSTOM[tab.custom])body+=CUSTOM[tab.custom].html(tab);
  var gl=(tab.groups||[]).map(function(g,gi){return {g:g,gi:gi}});
  if(sec.id==='tavern')gl.sort(function(x,y){return (y.g.t==='Ночлег')-(x.g.t==='Ночлег')||x.gi-y.gi});
  if(sec.id==='drinks'&&tab.id==='wine')gl.sort(function(x,y){return (x.gi<4)-(y.gi<4)||x.gi-y.gi});
  body+=gl.map(function(o){return group(sec,tab,o.g,o.gi)}).join('');
  app.innerHTML='<div class="sh"><h1><span aria-hidden="true">'+sec.ic+'</span> '+sec.t+'<small lang="en">'+sec.e+'</small></h1>'+(sec.intro?'<p class="intro">'+sec.intro+'</p>':'')+'</div>'+
    '<div class="tabs'+(sec.tiered?' tiered':'')+'" role="tablist">'+tabs+'</div><div class="tabbody">'+body+'</div>';
  if(tab.custom&&CUSTOM[tab.custom]&&CUSTOM[tab.custom].init)CUSTOM[tab.custom].init(tab);
  var on=app.querySelector('.tb.on');
  if(on&&on.scrollIntoView){var bar=on.parentNode;bar.scrollLeft=on.offsetLeft-bar.clientWidth/2+on.clientWidth/2}
}

/* calculators */
function opts(list,sel){return list.map(function(p,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+p[0]+' ×'+String(p[1]).replace('.',',')+'</option>'}).join('')}
function checks(list,key){return list.map(function(b,i){return '<label><input type="checkbox" data-'+key+'="'+i+'"> <span>'+b[0]+'</span><em>×'+String(b[1]).replace('.',',')+'</em></label>'}).join('')}
var CUSTOM={
bounty:{html:function(){
  var crs=Object.keys(XP);
  return '<div class="calc" id="bc"><label class="f"><span>Чудовище</span><select id="bc-mon"><option value="">Другое: укажу ПО</option>'+MONSTERS.map(function(m,i){return '<option value="'+i+'"'+(i===3?' selected':'')+'>'+m[0]+', ПО '+m[2]+'</option>'}).join('')+'</select></label>'+
  '<div class="f2"><label class="f"><span>ПО (CR)</span><select id="bc-cr">'+crs.map(function(c){return '<option'+(c==='1/4'?' selected':'')+'>'+c+'</option>'}).join('')+'</select></label>'+
  '<label class="f"><span>Сколько голов</span><input id="bc-n" type="number" min="1" max="999" value="1" inputmode="numeric"></label></div>'+
  '<label class="f"><span>Кто платит</span><select id="bc-pay">'+opts(PAYERS,0)+'</select></label>'+
  '<fieldset class="chk"><legend>Обстоятельства</legend>'+checks(BMODS,'bm')+'</fieldset>'+
  '<output id="bc-out" class="out" aria-live="polite"></output></div>';
},init:function(){bountyCalc()}},
quest:{html:function(){
  return '<div class="calc" id="qc"><div class="f2"><label class="f"><span>Героев</span><input id="qc-n" type="number" min="1" max="12" value="4" inputmode="numeric"></label>'+
  '<label class="f"><span>Дней работы</span><input id="qc-d" type="number" min="1" max="365" value="3" inputmode="numeric"></label></div>'+
  '<label class="f"><span>Уровень группы</span><select id="qc-t">'+QTIERS.map(function(t,i){return '<option value="'+i+'">'+t[0]+', ставка '+(t[1]/100)+' зм в день на героя</option>'}).join('')+'</select></label>'+
  '<label class="f"><span>Опасность</span><select id="qc-r">'+opts(QDANGER,1)+'</select></label>'+
  '<label class="f"><span>Заказчик</span><select id="qc-c">'+opts(QCLIENT,2)+'</select></label>'+
  '<fieldset class="chk"><legend>Особые условия</legend>'+checks(QMODS,'qm')+'</fieldset>'+
  '<output id="qc-out" class="out" aria-live="polite"></output></div>'+
  '<div class="note">Ставка на героя в день: 5 зм на уровнях 1–4 (две с половиной ставки квалифицированного наёмника — плата за риск и редкость навыков), 25 зм на 5–10, 200 зм на 11–16, 1 000 зм на 17–20. Это расчёт справочника, а не правило книги.</div>';
},init:function(){questCalc()}},
gen:{html:function(tab){return '<div id="gbox" data-kind="'+tab.kind+'"></div>'},init:function(tab){genRender(tab.kind)}},
spellitem:{html:function(){
  return '<div class="calc" id="sc"><label class="f"><span>Круг заклинания</span><select id="sc-l">'+SI_LV.map(function(p,i){return '<option value="'+i+'"'+(i===3?' selected':'')+'>'+(i?i+' круг':'Заговор')+'</option>'}).join('')+'</select></label>'+
  '<label class="f"><span>Встроено в</span><select id="sc-b">'+SI_BASE.map(function(b,i){return '<option value="'+i+'">'+b[0]+'</option>'}).join('')+'</select></label>'+
  '<label class="f"><span>Как часто</span><select id="sc-f">'+SI_FREQ.map(function(f,i){return '<option value="'+i+'">'+f[0]+'</option>'}).join('')+'</select></label>'+
  '<fieldset class="chk"><legend>Условия</legend>'+checks(SI_MODS,'sm')+'</fieldset>'+
  '<output id="sc-out" class="out" aria-live="polite"></output></div>'+
  '<div class="note">Формула справочника: цена «раз до долгого отдыха» × частота × условия + цена основы. Это расчёт, а не правило книги; официальные предметы для сверки — внизу вкладки.</div>';
},init:function(){spellCalc()}},
sources:{html:function(){
  return '<div class="srcs">'+Object.keys(SRC).map(function(k){return '<div class="srow"><span class="src">'+SRC[k][0]+'</span><span>'+SRC[k][1]+'</span></div>'}).join('')+'</div>'+
  '<div class="note">Если цена есть в книге 2024, используется она. Если нет — берётся книга 2014 или её дополнения. Если нет и там, цена рассчитана от ближайших официальных ориентиров (питание и ночлег, ставки наёмников, цена по редкости) или от исторических данных, пересчитанных в монеты D&amp;D.</div>';
}}
};
function num(id,def,min,max){var el=document.getElementById(id);var v=parseInt(el&&el.value,10);if(isNaN(v))v=def;return Math.max(min,Math.min(max,v))}
function prod(list,key){var k=1;app.querySelectorAll('[data-'+key+']').forEach(function(c){if(c.checked)k*=list[+c.getAttribute('data-'+key)][1]});return k}
function fx(k){return '×'+(Math.round(k*100)/100).toString().replace('.',',')}
function rarity(gp){return gp<200?'обычный':gp<1300?'необычный':gp<12500?'редкий':gp<90000?'очень редкий':'легендарный'}
function spellCalc(){
  var out=document.getElementById('sc-out');if(!out)return;
  var l=+document.getElementById('sc-l').value,f=SI_FREQ[+document.getElementById('sc-f').value],b=SI_BASE[+document.getElementById('sc-b').value];
  var mods=prod(SI_MODS,'sm'),m=mult(),once=f[1]===0;
  var spell=(once?SI_SCROLL[l]:SI_LV[l]*f[1])*mods,gp=spell+b[1];
  var h='<div class="big">'+coins(gp*100*m)+'</div>'+
  '<div class="calc-sub">'+(once?'Расходуемый предмет, как свиток.':'Редкость по цене: '+rarity(gp)+'.')+'</div>'+
  '<div class="calc-sub">Заклинание '+coins(spell*100*m)+(b[1]?' + основа '+coins(b[1]*100*m):'')+'; '+(once?'по цене свитка':'база '+coins(SI_LV[l]*100)+', частота '+fx(f[1]))+(mods!==1?', условия '+fx(mods):'')+(m!==1?', регион '+fx(m):'')+'.</div>'+
  (once?'':'<div class="calc-sub">Для сравнения, свиток того же круга: '+coins(SI_SCROLL[l]*100*m)+'.</div>');
  if(f[1]===4&&l>=4)h+='<div class="warn">Заклинание 4 круга и выше по желанию ломает баланс. Такой предмет — уже артефакт, и цену ему назначает мастер.</div>';
  if(l===0&&!once&&f[1]!==4)h+='<div class="warn">Заговоры обычно встраивают «по желанию»: ограничивать их отдыхом почти не имеет смысла.</div>';
  out.innerHTML=h;
}
function bountyCalc(){
  var out=document.getElementById('bc-out');if(!out)return;
  var cr=document.getElementById('bc-cr').value,n=num('bc-n',1,1,999);
  var pay=PAYERS[+document.getElementById('bc-pay').value];
  var mods=prod(BMODS,'bm'),m=mult();
  var base=XP[cr]*20;var per=base*pay[1]*mods*m;var total=per*n;
  var h='<div class="big">'+coins(total)+'</div><div class="calc-sub">'+(n>1?'За голову '+coins(per)+'. ':'')+'База '+coins(base)+' (ПО '+cr+', '+nf(XP[cr])+' опыта ÷ 5); заказчик '+fx(pay[1])+(mods!==1?', обстоятельства '+fx(mods):'')+(m!==1?', регион '+fx(m):'')+'.</div>';
  if(pay[1]<=0.5&&total>20000)h+='<div class="warn">Деревне редко по карману больше 50–200 зм на всех. Остальное она может отдать едой, конём, ночлегом или долгом.</div>';
  out.innerHTML=h;
}
function questCalc(){
  var out=document.getElementById('qc-out');if(!out)return;
  var n=num('qc-n',4,1,12),d=num('qc-d',3,1,365);
  var t=QTIERS[+document.getElementById('qc-t').value],r=QDANGER[+document.getElementById('qc-r').value],c=QCLIENT[+document.getElementById('qc-c').value];
  var mods=prod(QMODS,'qm'),m=mult();
  var total=n*d*t[1]*r[1]*c[1]*mods*m;
  out.innerHTML='<div class="big">'+coins(total)+'</div><div class="calc-sub">На каждого '+coins(total/n)+'. Аванс 25–50%: '+coins(total*0.25)+'<span class="dash">–</span>'+coins(total*0.5)+'.</div>'+
  '<div class="calc-sub">'+n+' × '+d+' дн. × '+coins(t[1])+'; опасность '+fx(r[1])+', заказчик '+fx(c[1])+(mods!==1?', условия '+fx(mods):'')+(m!==1?', регион '+fx(m):'')+'.</div>';
}
app.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='bc-mon'&&e.target.value!==''){document.getElementById('bc-cr').value=MONSTERS[+e.target.value][2]}
  if(id==='bc-cr'){var mon=document.getElementById('bc-mon');var cur=mon.value!==''?MONSTERS[+mon.value]:null;if(cur&&cur[2]!==e.target.value)mon.value=''}

    if(GRAPE[V.g.split(' и ')[0]])desc='<b>'+V.g.split(' и ')[0]+'.</b> '+GRAPE[V.g.split(' и ')[0]];if(V.l)note=V.l.charAt(0).toUpperCase()+V.l.slice(1)+'.';}
  var price=x.cp!=null?(x.cp>0?coins(x.cp*m):'<span class="cn free">даром</span>'):priceHTML(rec.pp,m);
  var canAdd=x.cp!=null?x.cp>0:(rec.pp&&rec.pp.k==='v'&&rec.pp.v>0);
  var src=rec.src&&SRC[rec.src]?'<span class="src">'+SRC[rec.src][0]+'</span> '+SRC[rec.src][1]:'';
  return '<div class="ihead"><h2 id="ih">'+title+'</h2><p class="isub" lang="en">'+sub+'</p>'+(meta.length?'<p class="imeta">'+meta.join(', ')+'</p>':'')+'</div>'+
    body+(desc?'<p class="idesc">'+desc+'</p>':'')+(note?'<p class="inote">'+note+'</p>':'')+
    '<div class="iprice"><span>Цена'+(rec.unit?' <span class="it-u">'+rec.unit+'</span>':'')+'</span><b class="pr">'+price+'</b></div>'+
    (src?'<p class="isrc">'+src+'</p>':'')+(k!=='wine'&&k!=='weapon'&&k!=='armor'?'<p class="ilegal">Краткий пересказ правил; полный текст — в книге.</p>':'')+
    '<div class="iacts">'+(canAdd?'<button type="button" class="gb pri" id="iadd">Добавить в счёт</button>':'')+'<button type="button" class="gb" id="iclose">Закрыть</button></div>';
}
function findInWeapons(en){var r='simple';findSec('weapons').tabs.forEach(function(t){t.groups.forEach(function(g){g.items.forEach(function(it){if(it[1]===en)r=t.id})})});return r}
function findRu(en){for(var k in RU2W)if(RU2W[k]===en)return k;return en}
var isheet=document.getElementById('infosheet'),ibody=document.getElementById('ibody'),ICUR=null;
function openInfo(el){var rec=INDEX[el.getAttribute('data-info')];if(!rec)return;
  var x={};if(el.hasAttribute('data-cp'))x.cp=+el.getAttribute('data-cp');if(el.hasAttribute('data-l'))x.label=decodeURIComponent(el.getAttribute('data-l'));if(el.hasAttribute('data-sp'))x.sp=el.getAttribute('data-sp');if(el.hasAttribute('data-px'))x.plus=+el.getAttribute('data-px');
  ICUR={rec:rec,x:x};ibody.innerHTML=cardHTML(rec,x);isheet.hidden=false;document.body.classList.add('lock');var c=document.getElementById('iclose');if(c)c.focus()}
function closeInfo(){isheet.hidden=true;document.body.classList.remove('lock');ICUR=null}
isheet.addEventListener('click',function(e){if(e.target===isheet||e.target.id==='iclose'){closeInfo();return}
  if(e.target.id==='iadd'&&ICUR){if(ICUR.x.cp!=null)addBill(ICUR.rec.id,ICUR.x.cp,ICUR.x.label);else addBill(ICUR.rec.id);closeInfo()}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-info]');if(b){e.preventDefault();openInfo(b)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!isheet.hidden)closeInfo()});

/* routing */
var pending=null;
function render(){
  var h=decodeURIComponent(location.hash.replace(/^#/,''));
  var parts=h.split('/');var sec=findSec(parts[0]);
  document.getElementById('back').hidden=!sec;
  if(!sec)home();else section(sec,parts[1]);
  if(pending){var el=document.getElementById('i-'+pending);pending=null;
    if(el){el.scrollIntoView({block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
  else window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
function go(hash,focusId){pending=focusId||null;if(location.hash===hash||(hash==='#'&&!location.hash))render();else location.hash=hash}

/* region */
var sel=document.getElementById('region');
sel.innerHTML=REGIONS.map(function(r){return '<option value="'+r[0]+'"'+(r[0]===region?' selected':'')+'>'+r[1]+' ×'+String(r[2]).replace('.',',')+'</option>'}).join('');
function strip(){var s=document.getElementById('mstrip');var r=reg();if(r[2]===1){s.hidden=true;return}s.hidden=false;s.innerHTML='<span>Все цены пересчитаны: '+r[1]+' '+fx(r[2])+'</span><button type="button" id="mreset">Вернуть ×1</button>'}
function setRegion(v){region=v;store.set('pr_region',v);sel.value=v;strip();var y=window.scrollY;var keep=pending;pending=null;render();if(!keep)window.scrollTo(0,y);renderBill()}
sel.addEventListener('change',function(){setRegion(sel.value)});
document.getElementById('mstrip').addEventListener('click',function(e){if(e.target.id==='mreset')setRegion('city')});

/* bill */
var bill=store.get('pr_bill2',[]);if(!Array.isArray(bill))bill=[];
bill=bill.filter(function(b){return b&&INDEX[b.id]});
function saveBill(){store.set('pr_bill2',bill)}
function unitCp(b){return b.v!=null?b.v:INDEX[b.id].pp.v}
function billTotal(){var m=mult(),t=0;bill.forEach(function(b){t+=unitCp(b)*m*b.q});return t}
function renderBill(){
  var bar=document.getElementById('billbar');
  var cnt=bill.reduce(function(a,b){return a+b.q},0);
  bar.hidden=cnt===0;
  document.getElementById('bcount').textContent=cnt;
  document.getElementById('btotal').innerHTML=coins(billTotal());
  var m=mult();
  document.getElementById('blist').innerHTML=bill.length?bill.map(function(b,i){var r=INDEX[b.id];return '<li class="bl"><div class="bl-n">'+(b.l||r.it[0])+(r.unit&&!b.l?' <span class="it-u">'+r.unit+'</span>':'')+'<div class="it-d">'+(b.w||r.sec.t+', '+r.tab.t)+'</div></div><div class="qty"><button type="button" data-q="'+i+'" data-d="-1" aria-label="Меньше">−</button><span>'+b.q+'</span><button type="button" data-q="'+i+'" data-d="1" aria-label="Больше">+</button></div><div class="pr">'+coins(unitCp(b)*m*b.q)+'</div></li>'}).join(''):'<li class="empty">Счёт пуст. Нажмите «+» у любой цены, чтобы добавить её сюда.</li>';
  var sp=num('bsplit',1,1,99),t=billTotal();
  document.getElementById('bsum').innerHTML='<div class="sumrow"><span>Итого</span><b class="pr">'+coins(t)+'</b></div>'+(sp>1?'<div class="sumrow"><span>На каждого из '+sp+'</span><b class="pr">'+coins(t/sp)+'</b></div>':'');
}
var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},1600)}
function addBill(id,v,l){var r=INDEX[id];if(!r)return;var f=null;bill.forEach(function(b){if(b.id===id&&b.v===v&&b.l===l)f=b});if(f)f.q++;else{var e={id:id,q:1};if(v!=null){e.v=v;e.l=l;e.w=CURSHOP?CURSHOP.title:''}bill.push(e)}saveBill();renderBill();toast('В счёте: '+(l||r.it[0]))}
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-add]');if(a){addBill(a.getAttribute('data-add'));return}
  var s=e.target.closest('[data-search]');if(s){openSearch();return}
  var q=e.target.closest('[data-q]');if(q){var i=+q.getAttribute('data-q'),d=+q.getAttribute('data-d');bill[i].q+=d;if(bill[i].q<=0)bill.splice(i,1);saveBill();renderBill();return}
});
var sheet=document.getElementById('billsheet');
document.getElementById('billopen').addEventListener('click',function(){sheet.hidden=false;renderBill();document.getElementById('billclose').focus()});
document.getElementById('billclose').addEventListener('click',function(){sheet.hidden=true});
sheet.addEventListener('click',function(e){if(e.target===sheet)sheet.hidden=true});
document.getElementById('bclear').addEventListener('click',function(){bill=[];saveBill();renderBill();sheet.hidden=true});
document.getElementById('bsplit').addEventListener('input',renderBill);

/* search */
var ov=document.getElementById('search'),qi=document.getElementById('q'),qres=document.getElementById('qres');
function norm(s){return String(s||'').toLowerCase().replace(/ё/g,'е')}
FLAT.forEach(function(r){r.hay=norm(r.it[0]+' '+(r.it[1]||'')+' '+(r.it[4]||'')+' '+r.g.t)});
function openSearch(){ov.hidden=false;document.body.classList.add('lock');qi.value='';doSearch();setTimeout(function(){qi.focus()},30)}
function closeSearch(){ov.hidden=true;document.body.classList.remove('lock')}
function doSearch(){
  var q=norm(qi.value).trim();
  if(q.length<2){qres.innerHTML='<li class="empty">Введите хотя бы две буквы. Ищет по русским и английским названиям.</li>';return}
  var words=q.split(/\s+/);
  var res=FLAT.filter(function(r){return words.every(function(w){return r.hay.indexOf(w)>=0})});
  res.sort(function(a,b){var an=norm(a.it[0]).indexOf(words[0])===0?0:1,bn=norm(b.it[0]).indexOf(words[0])===0?0:1;return an-bn});
  var m=mult();
  qres.innerHTML=res.length?res.slice(0,80).map(function(r){return '<li><button type="button" class="sr" data-go="'+r.id+'"><span class="sr-m"><span class="it-n">'+r.it[0]+(r.unit?' <span class="it-u">'+r.unit+'</span>':'')+'</span><span class="it-d">'+r.sec.t+' › '+r.tab.t+' › '+r.g.t+'</span></span><span class="pr">'+priceHTML(r.pp,m)+'</span></button></li>'}).join('')+(res.length>80?'<li class="empty">Показаны первые 80 из '+res.length+'. Уточните запрос.</li>':''):'<li class="empty">Ничего не нашлось по запросу «'+qi.value.replace(/</g,'&lt;')+'». Попробуйте другое слово или английское название.</li>';
}
qi.addEventListener('input',doSearch);
qres.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(!b)return;var r=INDEX[b.getAttribute('data-go')];closeSearch();go('#'+r.sec.id+'/'+r.tab.id,r.id)});
document.getElementById('sbtn').addEventListener('click',openSearch);
document.getElementById('qx').addEventListener('click',closeSearch);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!ov.hidden)closeSearch();else if(!sheet.hidden)sheet.hidden=true}});
document.getElementById('back').addEventListener('click',function(){go('#')});

/* header height for sticky tabs */
function hh(){document.documentElement.style.setProperty('--hh',document.querySelector('.bar').offsetHeight+'px')}
window.addEventListener('resize',hh);hh();

strip();render();renderBill();
})();

</script>
</body>
</html>
